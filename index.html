let powerChartBarItems = []; // {iv, r} per clickable bar, in render order — lets tap-for-detail work correctly even for synthetic subdivided slices that aren't in S.intervals

function renderPowerChart(rows){
  const wrap = $('#powerChartWrap');
  const metrics = S.powerChartMetrics.filter(k=>POWER_CHART_METRICS[k]);
  const primary = metrics[0];
  const primaryDef = POWER_CHART_METRICS[primary];
  // "区間を分割" is a display-only option: it re-slices one or more
  // specifically selected intervals (tapped by the person) into N equal
  // pieces each, just for this chart, computing fresh stats for each slice
  // on the fly. S.intervals itself, the results table, and every other view
  // are completely untouched by it — every other interval keeps its own
  // single bar as usual. Several intervals can be split at once, each with
  // its own N; an already-split interval can't be re-split until it's
  // first "解除"d (undone).
  const sourceItems = [];
  S.intervals.forEach((iv,origIdx)=>{
    const n = S.powerChartSubdivisions[origIdx];
    if (n==='raw'){
      // one bar per individual recorded point — no averaging at all, so
      // every sample's own value shows through directly
      const recs = S.records.filter(r=>r.elapsed>=iv.start && r.elapsed<=iv.end);
      for (let i=0;i<recs.length-1;i++){
        const start = recs[i].elapsed, end = recs[i+1].elapsed;
        if (end<=start) continue;
        const subIv = { name:'', start, end, origIdx };
        sourceItems.push({ iv: subIv, r: computeIntervalStats(subIv, origIdx), isSub:true, origIdx, sliceIndex:i });
      }
    } else if (n>=2){
      const span = (iv.end-iv.start)/n;
      for (let i=0;i<n;i++){
        const start = iv.start+span*i;
        const end = i===n-1 ? iv.end : iv.start+span*(i+1); // last slice absorbs any rounding remainder
        // no renamed label per slice — the original interval's own name/number
        // is shown once as an overlay spanning all its slices (see below)
        const subIv = { name:'', start, end, origIdx };
        sourceItems.push({ iv: subIv, r: computeIntervalStats(subIv, origIdx), isSub:true, origIdx, sliceIndex:i });
      }
    } else {
      sourceItems.push({ iv, r: rows[origIdx], origIdx, sliceIndex:0 });
    }
  });
  const valid = sourceItems.filter(x=>primaryDef.get(x.r)!=null);
  if (!valid.length){
    wrap.innerHTML = '<div class="hint" style="padding:20px 0;">'+primaryDef.label+'が算出できる区間がありません。</div>';
    $('#expPowerChartPng').disabled = true;
    $('#powerChartDetail').style.display = 'none';
    return;
  }
  const xMode = S.powerChartXMode; // 'clock' | 'elapsed' | 'dist'
  const distMode = xMode==='dist';
  // Display-only rebasing: if interval 1 doesn't start at the true
  // beginning of the recording (e.g. the ride-to-the-start-line portion
  // was left out of the analysis), elapsed time and distance are shown
  // relative to interval 1's own start instead of the recording's true
  // start — reading 0:00:00 / 0km there — without touching S.records or
  // S.intervals themselves. Clock time is unaffected: it always shows the
  // real time of day regardless.
  const elapsedOffset = S.intervals.length ? S.intervals[0].start : 0;
  const distOffset = S.intervals.length ? nearestRecordByElapsed(S.intervals[0].start).dist : 0;
  function ivX0(iv){ return distMode ? nearestRecordByElapsed(iv.start).dist-distOffset : iv.start-elapsedOffset; }
  function ivX1(iv){ return distMode ? nearestRecordByElapsed(iv.end).dist-distOffset : iv.end-elapsedOffset; }

  const leftCount = Math.ceil(metrics.length/2), rightCount = Math.floor(metrics.length/2);
  const SCALE = 1.25;
  const W=800*S.powerChartWidthMult, H=340, padL=76+leftCount*34, padR=58+rightCount*34, padT=68, padB=68;
  let minX = Math.min(...S.intervals.map(ivX0));
  let maxX = Math.max(...S.intervals.map(ivX1));
  const spanX = Math.max(1, maxX-minX);
  const xScale = t => padL + (t-minX)/spanX * (W-padL-padR);
  const xScaleInv = px => minX + (px-padL)/(W-padL-padR) * spanX; // pixels back to data-space (elapsed sec / distance m) — for converting a tap position into a width-independent value

  // Re-derive which interval the subdivide-selection ("区間を分割"/"解除")
  // controls should target, from the vertical line's actual stored x
  // position — rather than trusting a separately-tracked index that could
  // otherwise go stale the moment a split/undo changes what's at that
  // position (e.g. right after pressing "解除", the old target would
  // otherwise point at nothing meaningful any more, even though the line
  // itself hasn't moved). Runs on every render, so it can never drift.
  if (powerChartDetailTarget){
    const matchIdx = S.intervals.findIndex(iv=> powerChartDetailTarget.t>=ivX0(iv) && powerChartDetailTarget.t<=ivX1(iv));
    S.powerChartSubdivideTargetIdx = matchIdx>=0 ? matchIdx : null;
  }
  {
    const t = S.powerChartSubdivideTargetIdx;
    $('#subdivideApplyBtn').disabled = t==null || S.powerChartSubdivisions[t]!=null;
    $('#subdivideResetBtn').disabled = t==null;
  }

  // picks a "nice" round step (1/2/2.5/5/10 × a power of ten) for tick
  // marks, so gridlines land on round numbers instead of awkward fractions
  // — this can leave a bit of blank space past the last tick, which is fine
  function niceStep(span, targetTicks){
    targetTicks = targetTicks || 4;
    if (!(span>0)) return 1;
    const roughStep = span/targetTicks;
    const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
    const norm = roughStep/magnitude;
    const nice = norm<=1 ? 1 : norm<=2 ? 2 : norm<=2.5 ? 2.5 : norm<=5 ? 5 : 10;
    return nice*magnitude;
  }

  // each metric gets its own independent y-scale (own axis, own nice max),
  // since units/ranges differ wildly (bpm vs W vs a 0-1 ratio, etc.)
  const metricScales = {};
  metrics.forEach(k=>{
    const def = POWER_CHART_METRICS[k];
    if (k==='elevation'){
      // elevation gets special treatment: the axis max never shrinks below
      // 100m (so a flat ride doesn't get an absurdly zoomed-in axis), and
      // if any point in the whole ride dips below sea level, the axis
      // minimum is that actual lowest recorded point (not rounded) with 0m
      // always included as one of the tick marks — even though that can
      // make the lower ticks land at an uneven spacing from the rest.
      const alts = S.records.map(r=>r.altSmooth).filter(v=>v!=null);
      if (!alts.length){ metricScales[k] = null; return; }
      const rawMax = Math.max(...alts) * 1.1;
      const rawMin = Math.min(...alts);
      const niceMin = rawMin<0 ? rawMin : 0;
      const step = niceStep(Math.max(rawMax,100)-Math.min(0,niceMin), 4);
      const niceMax = Math.max(100, Math.ceil(rawMax/step)*step);
      const ticks = [];
      for (let v=Math.ceil(niceMin/step)*step; v<=niceMax+1e-9; v+=step) ticks.push(v);
      if (niceMin<0 && !ticks.some(t=>Math.abs(t)<1e-6)){ ticks.push(0); ticks.sort((a,b)=>a-b); }
      metricScales[k] = { niceMax, niceMin, step, ticks, yScale: v => (H-padB) - ((v-niceMin)/(niceMax-niceMin)) * (H-padT-padB) };
      return;
    }
    const vals = valid.map(x=>def.get(x.r)).filter(v=>v!=null);
    if (!vals.length){ metricScales[k] = null; return; }
    const rawMax = Math.max(0.001, ...vals) * 1.1;
    const step = niceStep(rawMax, 4);
    const niceMax = Math.ceil(rawMax/step)*step;
    const ticks = [];
    for (let v=0; v<=niceMax+1e-9; v+=step) ticks.push(v);
    metricScales[k] = { niceMax, niceMin:0, step, ticks, yScale: v => (H-padB) - (v/niceMax) * (H-padT-padB) };
  });

  let svg = '';
  // title block, top-left, outside the plot area: start date/time + city
  // (both larger, same line), then the source file's name (smaller) below —
  // left-aligned to a position fixed to line up with the leftmost edge of
  // the "時刻/経過時間/距離(km)" caption (itself right-anchored at x=122,
  // so its own left edge stays put too) — not to padL, which shifts
  // whenever axes are added/removed or the x-axis mode changes
  const TITLE_X = 4;
  {
    let titleLine1 = fmtDate(S.records[0].t)+' '+fmtClockNoSec(S.records[0].t);
    if (S.cityName) titleLine1 += '　'+S.cityName;
    svg += '<text x="'+TITLE_X+'" y="16" text-anchor="start" font-size="13" font-weight="700" fill="'+cssVar('--text')+'">'+escapeHtml(titleLine1)+'</text>';
    svg += '<text x="'+TITLE_X+'" y="30" text-anchor="start" font-size="9.5" fill="'+cssVar('--text-faint')+'">'+escapeHtml(S.fileBaseName)+'</text>';
  }
  // gridlines follow the primary metric only, to avoid clutter
  const primaryScale = metricScales[primary];
  primaryScale.ticks.forEach(v=>{
    const y = primaryScale.yScale(v);
    svg += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="'+cssVar('--border')+'" stroke-width="1"/>';
  });
  // one y-axis (with its own tick labels) per selected metric, stacked left/right
  let li=0, ri=0;
  metrics.forEach((k,mi)=>{
    const def = POWER_CHART_METRICS[k], sc = metricScales[k];
    if (!sc) return;
    const onLeft = mi%2===0;
    const axisX = onLeft ? (padL - 8 - li*34) : (W-padR + 8 + ri*34);
    if (onLeft) li++; else ri++;
    sc.ticks.forEach(v=>{
      const y = sc.yScale(v);
      svg += '<text x="'+axisX+'" y="'+(y+3)+'" text-anchor="'+(onLeft?'end':'start')+'" font-size="9.5" fill="'+def.color+'">'+def.fmt(v)+'</text>';
    });
    // axis title, rotated so it reads bottom-to-top (its first character at
    // the bottom) on the left axis, vertically centred on the plot area's
    // own middle height. The right axis title sits further out and reads
    // the opposite way (top-to-bottom, rotated 180° from the left one) —
    // mirroring left and right makes each title read away from the plot.
    const titleY = (padT+(H-padB))/2;
    const titleX = onLeft ? axisX-23 : axisX+27;
    const titleRotate = onLeft ? -90 : 90;
    svg += '<text x="'+titleX+'" y="'+titleY+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+def.color+'" transform="rotate('+titleRotate+' '+titleX+' '+titleY+')">'+def.label+(def.unit?' ('+def.unit+')':'')+'</text>';
  });

  // x ticks. Distance mode, and elapsed-time mode when it's the selected
  // (primary) axis, both step arithmetically from the data's own start —
  // there's no natural "round" anchor for distance, and when elapsed time
  // itself is what the person is reading, nice round ELAPSED values (0:30:00,
  // 1:00:00, ...) matter more than lining up with the wall clock. Clock mode
  // instead aligns to real wall-clock boundaries (e.g. 7:30, 7:45, 8:00) —
  // the ride essentially never starts exactly on one, so the first tick can
  // sit closer to (or further from) the chart's left edge than the regular
  // spacing between the rest of the ticks.
  // Major gridline spacing is chosen from a fixed table of "reasonable"
  // intervals (rather than computed generically), each paired with its own
  // specific minor-gridline interval — not simply half the major spacing.
  const TIME_MAJOR_MIN = [1,2,5,10,15,20,30,60,90,120,180,240,360,720,1440]; // minutes
  const TIME_MINOR_MIN = [0.5,1,1,5,5,10,10,20,30,60,60,120,120,240,480]; // minutes
  const TIME_SUBMIN_MIN = [0.1,0.2,0.5,1,1,2,2,5,10,10,20,30,30,60,120]; // minutes
  const DIST_MAJOR_KM = [1,2,5,10,20,25,50,100,150,200,250,400,600];
  const DIST_MINOR_KM = [0.5,1,1,5,10,5,25,50,50,100,125,200,300];
  const DIST_SUBMIN_KM = [0.1,0.2,0.5,1,2,null,5,10,10,20,25,40,60]; // null = no sub-minor gridline for that major/minor pairing
  // Picks the smallest (densest) major step whose resulting label spacing
  // still leaves at least one character's width of blank gap between
  // adjacent labels, given the chart's ACTUAL current pixel width — rather
  // than aiming for a fixed tick count. This adapts automatically as the
  // width slider changes how many pixels are actually available.
  const LABEL_WIDTH_PX = 40; // rough estimate of the widest primary-row label (e.g. "7:00", "12:34") — reduced now that hours no longer show a leading zero
  const CHAR_GAP_PX = 7; // ~1 character's width of required blank gap
  function pickStep(span, majors, minors, submins, unitSec, plotWidthPx){
    for (let i=0;i<majors.length;i++){
      const stepValue = majors[i]*unitSec;
      const numTicks = Math.max(span/stepValue, 1);
      const pxPerTick = plotWidthPx/numTicks;
      if (pxPerTick >= LABEL_WIDTH_PX+CHAR_GAP_PX) return {major:stepValue, minor:minors[i]*unitSec, submin: submins[i]!=null ? submins[i]*unitSec : null};
    }
    const last = majors.length-1;
    return {major:majors[last]*unitSec, minor:minors[last]*unitSec, submin: submins[last]!=null ? submins[last]*unitSec : null};
  }
  const xStepInfo = distMode
    ? pickStep(spanX, DIST_MAJOR_KM, DIST_MINOR_KM, DIST_SUBMIN_KM, 1000, W-padL-padR)
    : pickStep(spanX, TIME_MAJOR_MIN, TIME_MINOR_MIN, TIME_SUBMIN_MIN, 60, W-padL-padR);
  const xStep = xStepInfo.major, xMinorStep = xStepInfo.minor, xSubminStep = xStepInfo.submin;
  let tickTs;
  if (distMode || xMode==='elapsed'){
    const xStart = Math.ceil(minX/xStep)*xStep;
    tickTs = [];
    for (let t=xStart; t<=maxX+1e-9; t+=xStep) tickTs.push(t);
    // the true start (0, typically) is displayed as a normal, centred tick
    // rather than the special right-anchored treatment clock mode uses —
    // its position already lines up naturally with the regular grid, so it
    // just needs to not be skipped when it doesn't land exactly on a step
    if (!tickTs.length || Math.abs(tickTs[0]-minX) > 1e-6) tickTs.unshift(minX);
  } else {
    const startUnix = S.records[0].t+minX+elapsedOffset, endUnix = S.records[0].t+maxX+elapsedOffset;
    const d0 = new Date(startUnix*1000); d0.setHours(0,0,0,0);
    const midnightUnix = Math.floor(d0.getTime()/1000);
    let tUnix = midnightUnix + Math.ceil((startUnix-midnightUnix)/xStep)*xStep;
    tickTs = [];
    while (tUnix <= endUnix+1e-9){ tickTs.push(tUnix - S.records[0].t - elapsedOffset); tUnix += xStep; }
  }
  // the three values (clock/elapsed/distance) at elapsed-time t, ordered to
  // match whichever mode is currently selected. Distance is a bare number
  // here — its "km" unit is stated once via the axis caption on the left
  // edge instead of being repeated at every single tick. t itself is
  // already relative to interval 1's own start (see elapsedOffset/distOffset
  // above) — the offset is added back only where an actual record lookup
  // needs the recording's true, absolute position.
  function labelsAt(t){
    let clockStr, elapsedStr, distStr;
    if (distMode){
      distStr = fmtKm(t);
      const rec = nearestRecordByDist(t+distOffset);
      clockStr = fmtClockNoSec(rec.t); elapsedStr = fmtHMS(rec.elapsed-elapsedOffset);
    } else {
      elapsedStr = fmtHMS(t);
      clockStr = fmtClockNoSec(S.records[0].t+t+elapsedOffset);
      distStr = fmtKm(nearestRecordByElapsed(t+elapsedOffset).dist-distOffset);
    }
    return xMode==='clock' ? [clockStr,elapsedStr,distStr]
      : xMode==='elapsed' ? [elapsedStr,clockStr,distStr]
      : [distStr,clockStr,elapsedStr];
  }
  function drawTickLabels(x, lines, anchor){
    anchor = anchor || 'middle';
    lines.forEach((str,i)=>{
      svg += '<text x="'+x+'" y="'+(H-padB+16+i*13)+'" text-anchor="'+anchor+'" font-size="'+(i===0?10:9)+'" fill="'+(i===0?cssVar('--text-dim'):cssVar('--text-faint'))+'">'+str+'</text>';
    });
  }
  // a small caption at the far left names what each of the three rows is
  const capLines = xMode==='clock' ? ['時刻','経過時間','距離(km)']
    : xMode==='elapsed' ? ['経過時間','時刻','距離(km)']
    : ['距離(km)','時刻','経過時間'];
  capLines.forEach((str,i)=>{
    svg += '<text x="'+(padL-46)+'" y="'+(H-padB+16+i*13)+'" text-anchor="end" font-size="9" font-weight="600" fill="'+cssVar('--text-faint')+'">'+str+'</text>';
  });
  // The true start and end of the data always get a full label, even off
  // the regular grid — and take priority over any regular tick label that
  // would otherwise collide with them (that regular label's text is
  // skipped, though its gridline stays). Elapsed/distance modes skip the
  // start label specifically: they almost always start essentially at 0
  // already, which the first regular tick already covers, making a
  // separate one redundant. The end label is always left-anchored against
  // the right axis position (not centred/nudged on its exact x) — reads
  // more cleanly and never gets clipped by the chart's own right edge. In
  // clock mode the start label gets the matching treatment: right-anchored
  // against the left axis.
  const endLabelX = W-padR;
  const startLabelX = xMode==='clock' ? padL : null;
  const CHAR_PX = 7; // rough per-character width at the tick labels' font-size
  tickTs.forEach(t=>{
    const x = xScale(t);
    svg += '<line x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(H-padB)+'" stroke="'+cssVar('--border')+'" stroke-width="1"/>';
    // the regular tick's own label is centred at x, so only its actual
    // half-width (based on how many characters it really has — "7:00" and
    // "12:34:56" don't need the same clearance) plus the required gap
    // matters, not a fixed worst-case estimate
    const lines = labelsAt(t);
    const halfW = lines[0].length * CHAR_PX / 2;
    const collidesEnd = (endLabelX - x) < halfW + CHAR_GAP_PX;
    const collidesStart = startLabelX!=null && (x - startLabelX) < halfW + CHAR_GAP_PX;
    if (!collidesEnd && !collidesStart) drawTickLabels(x, lines);
  });
  // shared generator for major/minor/sub-minor tick positions at a given
  // step — wall-clock aligned in clock mode, simple arithmetic otherwise
  function generateTicksAtStep(step){
    const ts = [];
    if (distMode || xMode==='elapsed'){
      const tStart = Math.ceil(minX/step)*step;
      for (let t=tStart; t<=maxX+1e-9; t+=step) ts.push(t);
    } else {
      const startUnix = S.records[0].t+minX+elapsedOffset, endUnix = S.records[0].t+maxX+elapsedOffset;
      const d0 = new Date(startUnix*1000); d0.setHours(0,0,0,0);
      const midnightUnix = Math.floor(d0.getTime()/1000);
      let tUnix = midnightUnix + Math.ceil((startUnix-midnightUnix)/step)*step;
      while (tUnix <= endUnix+1e-9){ ts.push(tUnix - S.records[0].t - elapsedOffset); tUnix += step; }
    }
    return ts;
  }
  // minor gridlines at their own specified interval (paired with the major
  // spacing above), not simply bisecting each major interval
  const minorTs = generateTicksAtStep(xMinorStep);
  // the minor gridlines' own scale, shown as a visual bar with end-ticks —
  // like a map's scale bar — aligned with wherever the leftmost minor
  // gridline actually falls (not always the plot's left text margin, since
  // that gridline's position varies with the data range)
  if (minorTs.length){
    const fmtGridStep = v => distMode ? (v/1000)+'km' : ((v/60)%1===0 ? (v/60) : (v/60).toFixed(1))+'分';
    const leftMinorX = xScale(minorTs[0]);
    const barW = xScale(minX+xMinorStep) - xScale(minX);
    const sbY = 48;
    svg += '<line x1="'+leftMinorX+'" y1="'+sbY+'" x2="'+(leftMinorX+barW)+'" y2="'+sbY+'" stroke="'+cssVar('--text-faint')+'" stroke-width="1"/>';
    svg += '<line x1="'+leftMinorX+'" y1="'+(sbY-3)+'" x2="'+leftMinorX+'" y2="'+(sbY+3)+'" stroke="'+cssVar('--text-faint')+'" stroke-width="1"/>';
    svg += '<line x1="'+(leftMinorX+barW)+'" y1="'+(sbY-3)+'" x2="'+(leftMinorX+barW)+'" y2="'+(sbY+3)+'" stroke="'+cssVar('--text-faint')+'" stroke-width="1"/>';
    svg += '<text x="'+(leftMinorX+barW+4)+'" y="'+(sbY+3)+'" text-anchor="start" font-size="9" fill="'+cssVar('--text-faint')+'">'+escapeHtml(fmtGridStep(xMinorStep))+'</text>';
  }
  minorTs.forEach(t=>{
    if (tickTs.some(mt=>Math.abs(mt-t)<1e-6)) return; // skip where a major line already sits
    const mx = xScale(t);
    svg += '<line x1="'+mx+'" y1="'+padT+'" x2="'+mx+'" y2="'+(H-padB)+'" stroke="'+cssVar('--border')+'" stroke-width="1" stroke-opacity="0.4"/>';
  });
  // sub-minor gridlines: a third, even fainter tier — some major/minor
  // pairings (e.g. the 25km major step) specify no sub-minor at all
  if (xSubminStep!=null){
    const subminTs = generateTicksAtStep(xSubminStep);
    subminTs.forEach(t=>{
      if (tickTs.some(mt=>Math.abs(mt-t)<1e-6)) return;
      if (minorTs.some(mt=>Math.abs(mt-t)<1e-6)) return;
      const mx = xScale(t);
      svg += '<line x1="'+mx+'" y1="'+padT+'" x2="'+mx+'" y2="'+(H-padB)+'" stroke="'+cssVar('--border')+'" stroke-width="1" stroke-opacity="0.18"/>';
    });
  }
  {
    const trueEndX = xScale(maxX);
    svg += '<line x1="'+trueEndX+'" y1="'+padT+'" x2="'+trueEndX+'" y2="'+(H-padB)+'" stroke="'+cssVar('--border')+'" stroke-width="1"/>';
    drawTickLabels(endLabelX, labelsAt(maxX), 'start');
    if (startLabelX!=null){
      svg += '<line x1="'+xScale(minX)+'" y1="'+padT+'" x2="'+xScale(minX)+'" y2="'+(H-padB)+'" stroke="'+cssVar('--border')+'" stroke-width="1"/>';
      drawTickLabels(startLabelX, labelsAt(minX), 'end');
    }
  }

  let primaryBarsSvg = '';
  powerChartBarItems = [];
  valid.forEach((item,vi)=>{
    const {iv,r} = item;
    const idx = powerChartBarItems.push(item) - 1;
    const x0 = xScale(ivX0(iv)), x1 = xScale(ivX1(iv));
    const w = Math.max(1, x1-x0);
    // primary metric: filled bar (matches the original single-metric look).
    // No stroke on the bar itself — adjacent/touching intervals would each
    // draw their own border at the shared edge, doubling up and poking
    // inward in a way that looked like a rendering glitch. A single bold
    // outline traces the outer silhouette separately, below.
    const y0 = primaryScale.yScale(0), y1p = primaryScale.yScale(primaryDef.get(r));
    primaryBarsSvg += '<rect class="powerBar" data-idx="'+idx+'" x="'+x0+'" y="'+y1p+'" width="'+w+'" height="'+Math.max(0,y0-y1p)+'" '+
      'fill="'+primaryDef.color+'" fill-opacity="0.4" style="cursor:pointer;"/>';
    // any extra metrics: thin horizontal line segments at their own scale —
    // except elevation, which is drawn once afterwards as a continuous
    // smooth profile from the actual record data instead of a flat
    // per-interval average (an averaged elevation line looks like stairs
    // and hides the real climb/descent shape)
    metrics.slice(1).forEach(k=>{
      if (k==='elevation') return;
      const def = POWER_CHART_METRICS[k], sc = metricScales[k];
      const v = sc && def.get(r);
      if (v==null) return;
      const y = sc.yScale(v);
      primaryBarsSvg += '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="'+def.color+'" stroke-width="2.5" style="pointer-events:none;"/>';
    });
    primaryBarsSvg += '<rect x="'+x0+'" y="'+padT+'" width="'+w+'" height="'+(H-padB-padT)+'" fill="transparent" data-idx="'+idx+'" class="powerBar" style="cursor:pointer;"/>';
  });
  // a bold outline traces the outer silhouette of the primary bars, on top
  // of the fill, so the shape reads clearly even where two intervals' fills
  // touch or nearly touch
  const primaryOutlineItems = valid.map(({iv,r})=>({
    x0: xScale(ivX0(iv)), x1: xScale(ivX1(iv)), y: primaryScale.yScale(primaryDef.get(r))
  }));
  if (primaryOutlineItems.length){
    primaryBarsSvg += '<path d="'+buildStepOutline(primaryOutlineItems, primaryScale.yScale(0))+'" fill="none" stroke="'+primaryDef.color+'" stroke-width="1.25" stroke-linejoin="round" style="pointer-events:none;"/>';
  }
  // elevation, if selected as a secondary metric, gets a continuous smooth
  // profile line built straight from the ride's own record data (not
  // per-interval averages), so the actual climb/descent shape shows through
  if (metrics.slice(1).includes('elevation') && metricScales.elevation){
    const elevSc = metricScales.elevation;
    const step = Math.max(1, Math.floor(S.records.length/700));
    const pts = [];
    for (let i=0;i<S.records.length;i+=step){
      const rec = S.records[i];
      if (rec.altSmooth==null) continue;
      const xv = (distMode ? rec.dist-distOffset : rec.elapsed-elapsedOffset);
      if (xv<minX || xv>maxX) continue;
      pts.push([xScale(xv), elevSc.yScale(rec.altSmooth)]);
    }
    if (pts.length){
      const baseline = elevSc.yScale(elevSc.niceMin);
      let d = 'M'+pts[0][0]+' '+baseline+' ';
      pts.forEach(p=> d += 'L'+p[0]+' '+p[1]+' ');
      d += 'L'+pts[pts.length-1][0]+' '+baseline+' Z';
      primaryBarsSvg += '<path d="'+d+'" fill="'+POWER_CHART_METRICS.elevation.color+'" fill-opacity="0.4" stroke="none" style="pointer-events:none;"/>';
    }
  }
  // interval markers, drawn last so they're always on top of both the fill
  // and the outline. The specifically-targeted (subdivided) interval gets
  // the numbered-circle / line / end-dot overlay (matching page 2's chart)
  // spanning all of its slices; every other interval keeps its own normal
  // single rotated label, same as when nothing is being subdivided at all.
  // the "selected" highlight is drawn first, in its own pass, so the
  // marker/label pass below always ends up layered on top of it rather than
  // potentially being covered by it. Its bounds match whichever specific
  // slice the vertical dashed line currently points to (so both always
  // refer to the same piece), falling back to the whole interval if no
  // matching detail tap exists yet. A plain white-ish overlay tint (rather
  // than a colour-matched fill) lightens whatever's underneath regardless
  // of that bar's own colour, with no border.
  if (S.powerChartSubdivideTargetIdx!=null){
    let hx0, hx1, hr;
    const dt = powerChartDetailTarget;
    // Match by which bar's data-space range actually contains the stored
    // tap position (not by the stored sliceIndex, which can go stale the
    // moment a split changes how many slices exist — e.g. index 0 meant "the
    // whole interval" before splitting, but "just the first sliver" after —
    // and not by a pixel position, which would drift if the graph's width
    // changes). Re-resolving this way keeps the fill matching wherever the
    // line actually points, regardless of width changes or when the split
    // happened relative to the tap.
    const matchItem = dt && dt.origIdx===S.powerChartSubdivideTargetIdx
      ? powerChartBarItems.find(it=>{
          if (!it || it.origIdx!==dt.origIdx) return false;
          return dt.t>=ivX0(it.iv) && dt.t<=ivX1(it.iv);
        })
      : null;
    if (matchItem){
      hx0 = xScale(ivX0(matchItem.iv)); hx1 = xScale(ivX1(matchItem.iv)); hr = matchItem.r;
    } else {
      const iv = S.intervals[S.powerChartSubdivideTargetIdx];
      hx0 = xScale(ivX0(iv)); hx1 = xScale(ivX1(iv)); hr = rows[S.powerChartSubdivideTargetIdx];
    }
    if (hr && primaryDef.get(hr)!=null){
      const barTopY = primaryScale.yScale(primaryDef.get(hr));
      const baseY = primaryScale.yScale(0);
      const rectY = Math.min(barTopY, baseY), rectH = Math.abs(baseY-barTopY);
      primaryBarsSvg += '<rect id="powerChartSelFill" x="'+hx0+'" y="'+rectY+'" width="'+(hx1-hx0)+'" height="'+rectH+'" fill="#ffffff" fill-opacity="0.35" stroke="none" style="pointer-events:none;"/>';
    }
  }
  const CHAR_SHIFT_PX = 0.6*7; // 0.6 characters, matching the ~7px/char estimate used elsewhere
  const BOUNDARY_TIME_EPS = 2; // seconds — treat as "the same moment" within this tolerance
  const BOUNDARY_DIST_EPS = 50; // metres — treat as "the same place" within this tolerance (GPS/recording noise)
  // Works out how a タイプb interval's start/end names should be nudged (or
  // hidden) based on what's adjacent to them — see the four-case rule set:
  // if the neighbouring interval shares this interval's boundary name AND
  // its time also lines up with no gap, they're just passing through (name
  // omitted, no shift); if the name matches but only the *place* lines up
  // (a rest stop at the same spot), shift apart in clock/elapsed modes but
  // collapse to unshifted+omitted in distance mode (same place = same x
  // already); if the name matches but neither time nor place line up (a
  // deliberately non-contiguous extract), or the names simply don't match
  // at all, shift apart in every mode. At either end of the whole interval
  // list, or against a タイプa neighbour (no name to compare), there's
  // nothing to reconcile — sits at the interval's own edge, unshifted.
  function typeBBoundaryInfo(i){
    const iv = S.intervals[i];
    let startOffset = 0, startHide = false, endOffset = 0, endHide = false;
    if (i>0 && S.intervals[i-1].nameType==='b'){
      const prevIv = S.intervals[i-1];
      const namesMatch = !!(prevIv.endName && iv.startName && prevIv.endName===iv.startName);
      if (namesMatch){
        const timeMatches = Math.abs(prevIv.end - iv.start) < BOUNDARY_TIME_EPS;
        const prevEndDist = nearestRecordByElapsed(prevIv.end).dist;
        const nextStartDist = nearestRecordByElapsed(iv.start).dist;
        const distMatches = Math.abs(prevEndDist - nextStartDist) < BOUNDARY_DIST_EPS;
        if (timeMatches && distMatches){ startOffset = 0; }
        else if (!timeMatches && distMatches){ startOffset = distMode ? 0 : CHAR_SHIFT_PX; }
        else { startOffset = CHAR_SHIFT_PX; }
      } else {
        startOffset = CHAR_SHIFT_PX;
      }
    }
    if (i<S.intervals.length-1 && S.intervals[i+1].nameType==='b'){
      const nextIv = S.intervals[i+1];
      const namesMatch = !!(iv.endName && nextIv.startName && iv.endName===nextIv.startName);
      if (namesMatch){
        const timeMatches = Math.abs(iv.end - nextIv.start) < BOUNDARY_TIME_EPS;
        const prevEndDist = nearestRecordByElapsed(iv.end).dist;
        const nextStartDist = nearestRecordByElapsed(nextIv.start).dist;
        const distMatches = Math.abs(prevEndDist - nextStartDist) < BOUNDARY_DIST_EPS;
        if (timeMatches && distMatches){ endHide = true; }
        else if (!timeMatches && distMatches){ if (distMode) endHide = true; else endOffset = -CHAR_SHIFT_PX; }
        else { endOffset = -CHAR_SHIFT_PX; }
      } else {
        endOffset = -CHAR_SHIFT_PX;
      }
    }
    return {startOffset, startHide, endOffset, endHide};
  }
  S.intervals.forEach((iv,i)=>{
    const x0 = xScale(ivX0(iv)), x1 = xScale(ivX1(iv));
    const isTypeB = iv.nameType==='b';
    const label = numberPrefix(i+1)+intervalDisplayName(iv,i);
    if (S.powerChartSubdivisions[i]!=null){
      const y = padT; // the line itself sits exactly at the plot's top edge; the circle straddles it
      primaryBarsSvg += '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="'+primaryDef.color+'" stroke-width="2" style="pointer-events:none;"/>';
      primaryBarsSvg += '<circle cx="'+x1+'" cy="'+y+'" r="3.5" fill="'+primaryDef.color+'" style="pointer-events:none;"/>';
      primaryBarsSvg += '<circle cx="'+x0+'" cy="'+y+'" r="8" fill="'+primaryDef.color+'" stroke="#fff" stroke-width="1.5" style="pointer-events:none;"/>';
      primaryBarsSvg += '<text x="'+x0+'" y="'+(y+0.5)+'" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" fill="#08211d" style="pointer-events:none;">'+(i+1)+'</text>';
      // the interval's own name, still shown once across its full span —
      // subdividing changes how finely the data is drawn, not what the
      // interval is called. Positioned independently of the marker above,
      // so the marker itself always stays pinned to the very top regardless
      // of how long the name is.
      const ly = padT+14; // same anchor height as the non-subdivided label below, so all names line up regardless of the marker's own position
      if (isTypeB){
        const bInfo = typeBBoundaryInfo(i);
        const lxS = x0+3.5+bInfo.startOffset, lxE = x1+3.5+bInfo.endOffset;
        if (!bInfo.startHide) primaryBarsSvg += '<text x="'+lxS+'" y="'+ly+'" text-anchor="end" font-size="10.5" fill="'+primaryDef.color+'" transform="rotate(-90 '+lxS+' '+ly+')" style="pointer-events:none;">'+escapeHtml(numberPrefix(i+1)+(iv.startName||''))+'</text>';
        if (!bInfo.endHide) primaryBarsSvg += '<text x="'+lxE+'" y="'+ly+'" text-anchor="end" font-size="10.5" fill="'+primaryDef.color+'" transform="rotate(-90 '+lxE+' '+ly+')" style="pointer-events:none;">'+escapeHtml(iv.endName||'')+'</text>';
      } else {
        const lx = (x0+x1)/2+3.5;
        primaryBarsSvg += '<text x="'+lx+'" y="'+ly+'" text-anchor="end" font-size="10.5" fill="'+primaryDef.color+'" transform="rotate(-90 '+lx+' '+ly+')" style="pointer-events:none;">'+escapeHtml(label)+'</text>';
      }
    } else if (isTypeB){
      // separate start/end names, written vertically at the interval's own
      // start and end x-positions respectively (adjusted per the boundary
      // rules above), instead of one combined label at the centre
      const ly = padT+14;
      const bInfo = typeBBoundaryInfo(i);
      const lxS = x0+3.5+bInfo.startOffset, lxE = x1+3.5+bInfo.endOffset;
      if (!bInfo.startHide) primaryBarsSvg += '<text x="'+lxS+'" y="'+ly+'" text-anchor="end" font-size="10.5" fill="'+primaryDef.color+'" transform="rotate(-90 '+lxS+' '+ly+')" style="pointer-events:none;">'+escapeHtml(numberPrefix(i+1)+(iv.startName||''))+'</text>';
      if (!bInfo.endHide) primaryBarsSvg += '<text x="'+lxE+'" y="'+ly+'" text-anchor="end" font-size="10.5" fill="'+primaryDef.color+'" transform="rotate(-90 '+lxE+' '+ly+')" style="pointer-events:none;">'+escapeHtml(iv.endName||'')+'</text>';
    } else {
      // written vertically, running upward, centred horizontally within the
      // interval's own bar (nudged half a character further right). Anchored
      // by its END so that end always sits at the very top of the plot area,
      // regardless of how long each label is — only the start (further down)
      // varies from one label to the next.
      const lx = (x0+x1)/2+3.5, ly = padT+14;
      primaryBarsSvg += '<text x="'+lx+'" y="'+ly+'" text-anchor="end" font-size="10.5" fill="'+primaryDef.color+'" transform="rotate(-90 '+lx+' '+ly+')" style="pointer-events:none;">'+escapeHtml(label)+'</text>';
    }
  });
  const bars = primaryBarsSvg;

  svg = '<svg viewBox="0 0 '+W+' '+H+'" width="'+(W*SCALE)+'" height="'+(H*SCALE)+'" style="display:block;" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" xmlns="http://www.w3.org/2000/svg">'+svg+bars+'</svg>';
  wrap.innerHTML = svg;
  wrap.querySelectorAll('.powerBar').forEach(el=>{
    el.addEventListener('click', e=>{
      const idx = Number(el.dataset.idx);
      const svgEl = wrap.querySelector('svg');
      const svgRect = svgEl.getBoundingClientRect();
      const tapX = (e.clientX-svgRect.left)/svgRect.width * W;
      const tapT = xScaleInv(tapX);
      showPowerChartDetail(idx, tapT);
      const item = powerChartBarItems[idx];
      if (item){
        // tapping any bar — whether a whole not-yet-split interval, or one
        // slice of an already-split one — selects that interval as the
        // "区間を分割"/"解除" target. If it's already split, "区間を分割" is
        // disabled (must be undone first); otherwise "解除" just clears the
        // pending selection.
        S.powerChartSubdivideTargetIdx = item.origIdx;
        $('#subdivideApplyBtn').disabled = S.powerChartSubdivisions[item.origIdx]!=null;
        $('#subdivideResetBtn').disabled = false;
        renderPowerChart(lastResults.rows.filter(r=>!r.isSummary));
      }
    });
  });
  $('#expPowerChartPng').disabled = false;
  powerChartPlotBounds = {padT, padB, H, W};
  powerChartXScaleFn = xScale;
  applyPowerChartDetailHighlight();
  // Refresh the detail popup's text too, re-resolving from the line's own
  // stored position — a split/undo can change which slice that position
  // now falls into, and without this the text would keep describing the
  // pre-split/undo slice until the person happened to tap again.
  if (powerChartDetailTarget){
    const dt = powerChartDetailTarget;
    const box = $('#powerChartDetail');
    if (box && box.style.display!=='none'){
      const item = powerChartBarItems.find(it=> it && it.origIdx===dt.origIdx && dt.t>=ivX0(it.iv) && dt.t<=ivX1(it.iv));
      if (item) box.innerHTML = buildPowerChartDetailHtml(item.iv, item.r, item.origIdx);
    }
  }
}

let powerChartDetailTarget = null; // {origIdx, sliceIndex, t} — t is a data-space value (elapsed seconds or distance metres, matching whatever ivX0/ivX1 currently return), not a pixel position, so it stays correct even if the chart's width changes
let powerChartPlotBounds = null; // {padT, padB, H} of the most recent render, for the selection line's vertical extent
let powerChartXScaleFn = null; // the most recent render's xScale, so this can convert t -> pixels fresh each time
function applyPowerChartDetailHighlight(){
  const svg = $('#powerChartWrap svg');
  const existing = svg && svg.querySelector('#powerChartSelLine');
  if (existing) existing.remove();
  if (!svg || !powerChartDetailTarget || !powerChartPlotBounds || !powerChartXScaleFn) return;
  const {padT, padB, H} = powerChartPlotBounds;
  const x = powerChartXScaleFn(powerChartDetailTarget.t);
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('id', 'powerChartSelLine');
  line.setAttribute('x1', x); line.setAttribute('x2', x);
  line.setAttribute('y1', padT); line.setAttribute('y2', H-padB);
  line.setAttribute('stroke', '#e08a1e'); // orange, per request — distinct from the accent teal used elsewhere
  line.setAttribute('stroke-width', '2');
  line.setAttribute('stroke-dasharray', '5 4');
  line.setAttribute('style', 'pointer-events:none;');
  svg.appendChild(line); // appended last so it draws on top of everything else
}
// Shared HTML for the detail popup — used both when first tapping a bar
// and when refreshing it after a split/undo changes what the line's stored
// position now resolves to (see refreshPowerChartDetailBox below).
function buildPowerChartDetailHtml(iv, r, origIdx){
  // for a synthetic sub-slice (from subdivision), iv itself carries no name
  // at all — fall back to the original interval it came from, so the popup
  // still shows the real (タイプa or b) name rather than a blank title
  const nameSource = (origIdx!=null && S.intervals[origIdx]) ? S.intervals[origIdx] : iv;
  return '<b>'+intervalDisplayNameHtml(nameSource, origIdx!=null?origIdx:0)+'</b> ・ '+fmtClock(r.startTime)+'〜'+fmtClock(r.endTime)+
    '(経過 '+fmtHMS(r.duration)+') ・ 距離 '+ (r.distance!=null?fmtKm(r.distance):'--') +' km'+
    ' ・ 平均パワー '+(r.avgPower!=null?Math.round(r.avgPower)+'W':'--')+
    ' ・ 最高パワー '+(r.maxPower!=null?Math.round(r.maxPower)+'W':'--')+
    ' ・ 平均心拍 '+(r.avgHr!=null?Math.round(r.avgHr)+'bpm':'--')+
    ' ・ 平均速度(net) '+(r.avgSpeedNet!=null?r.avgSpeedNet.toFixed(1)+'km/h':'--');
}
function showPowerChartDetail(idx, tapT){
  const item = powerChartBarItems[idx];
  if (!item) return;
  const {iv, r} = item;
  // the line follows the exact spot tapped within the bar, not just its
  // centre — if tapT isn't given (e.g. re-applied after an unrelated
  // re-render), keep whatever t was already stored
  const t = tapT!=null ? tapT : (powerChartDetailTarget && powerChartDetailTarget.origIdx===item.origIdx && (powerChartDetailTarget.sliceIndex||0)===(item.sliceIndex||0) ? powerChartDetailTarget.t : tapT);
  powerChartDetailTarget = { origIdx: item.origIdx, sliceIndex: item.sliceIndex||0, t };
  applyPowerChartDetailHighlight();
  const box = $('#powerChartDetail');
  box.style.display = 'block';
  box.innerHTML = buildPowerChartDetailHtml(iv, r, item.origIdx);
}
// (the actual refresh happens inside renderPowerChart, right after the
// subdivide-target rescan, where ivX0/ivX1 are in scope — see there)

$('#expPowerChartPng').addEventListener('click', ()=>{
  // html2canvas doesn't reliably rasterize inline SVG (especially rotated
  // <text>, which this chart uses for the vertical interval labels) — draw
  // the SVG onto a canvas directly instead, which is the reliable way to
  // turn SVG into a PNG in the browser.
  const svgEl = document.querySelector('#powerChartWrap svg');
  if (!svgEl) return;
  // exclude the vertical selection line and highlight fill from the saved
  // image — those are on-screen interaction aids, not part of the chart
  // itself — by stripping them from a clone rather than the live SVG
  const clone = svgEl.cloneNode(true);
  const selLine = clone.querySelector('#powerChartSelLine');
  if (selLine) selLine.remove();
  const selFill = clone.querySelector('#powerChartSelFill');
  if (selFill) selFill.remove();
  const w = svgEl.width.baseVal.value, h = svgEl.height.baseVal.value;
  const svgData = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = w*scale; canvas.height = h*scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = cssVar('--surface') || '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob=>{
      if (!blob){ showExportMsg('PNGの生成に失敗しました', false); return; }
      saveAs('powerPng', S.fileBaseName+'_グラフ.png', blob, 'image/png', 'png', 'PNG', $('#expPowerChartPng'));
    }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); showExportMsg('PNGの生成に失敗しました', false); };
  img.src = url;
});

function renderResultsTable(cols, rows){
  let html = '<table id="resultsTable"><thead><tr><th class="noCol">#</th><th>区間</th>';
  cols.forEach(c=> html += '<th>'+COL_META[c].label+'</th>');
  html += '</tr></thead><tbody>';
  let n = 0;
  rows.forEach(r=>{
    const noLabel = r.isSummary ? '' : (++n)+'.';
    const nameHtml = r.isSummary ? escapeHtml(r.name) : intervalDisplayNameHtml(r, n-1);
    html += '<tr'+(r.isSummary?' class="summaryRow"':'')+'><td class="noCol">'+noLabel+'</td><td class="rowname">'+nameHtml+'</td>';
    cols.forEach(c=> html += '<td class="num">'+COL_META[c].fmt(r[c])+'</td>');
    html += '</tr>';
  });
  html += '</tbody></table>';
  $('#resultsWrap').innerHTML = html;
  syncResultsScrollIndicator();
}
// The results table's own custom scroll indicator (see #resultsScrollTrack)
// — starts right after the frozen "区間" name column, rather than the
// native browser scrollbar, which always spans the table's full width
// including that frozen column.
function syncResultsScrollIndicator(){
  // Deferred to the next frame so layout (column widths, wrapped-text
  // heights) has fully settled before anything gets measured — reading
  // offsetWidth/getBoundingClientRect synchronously right after an
  // innerHTML swap can occasionally catch an unsettled intermediate layout.
  requestAnimationFrame(()=>{
    const wrap = $('#resultsScrollWrap'), track = $('#resultsScrollTrack'), thumb = $('#resultsScrollThumb');
    const nameCell = document.querySelector('#resultsTable td.rowname');
    if (!wrap || !track || !thumb || !nameCell) return;
    // measured as an actual edge-to-edge distance (rather than summing two
    // separate cells' own offsetWidths) so it can't drift from border/
    // padding rounding between the two frozen cells
    const frozenWidth = nameCell.getBoundingClientRect().right - wrap.getBoundingClientRect().left;
    track.style.marginLeft = frozenWidth+'px';
    function update(){
      const scrollableWidth = wrap.clientWidth - frozenWidth;
      const contentWidth = wrap.scrollWidth - frozenWidth;
      if (contentWidth<=scrollableWidth+1){ track.style.display='none'; return; }
      track.style.display = '';
      const thumbFrac = scrollableWidth/contentWidth;
      thumb.style.width = Math.max(10, thumbFrac*100)+'%';
      const maxScroll = wrap.scrollWidth-wrap.clientWidth;
      const posFrac = maxScroll>0 ? wrap.scrollLeft/maxScroll : 0;
      thumb.style.left = (posFrac*(100-thumbFrac*100))+'%';
    }
    update();
    wrap.onscroll = update;
  });
}

async function saveFile(filename, data){
  // Self-hosted (GitHub Pages, localhost, a plain local file): a native
  // browser download always works here, so use it directly. Inside Claude's
  // own artifact preview, plain downloads are blocked by design, so fall
  // back to the platform's own save capability only in that environment.
  const inClaudeEnv = typeof window.claude !== 'undefined' && !!window.claude.use;
  if (!inClaudeEnv){
    try{
      const url = URL.createObjectURL(data);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      // iOS Safari often opens the file for preview instead of saving it
      // directly — the file is still right there, just one extra tap away.
      const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
      showExportMsg(isIOS
        ? filename+' を開きました。保存されない場合は共有アイコン(□に↑)から「ファイルに保存」を選んでください。'
        : filename+' をダウンロードしました(ブラウザの既定のダウンロード先フォルダに保存されます)。', true);
    }catch(e){
      showExportMsg('保存に失敗しました: '+(e&&e.message?e.message:'unknown'), false);
    }
    return;
  }
  if (!downloadsCap){
    try{ downloadsCap = await window.claude.use('downloads'); }catch(e){}
  }
  if (!downloadsCap){
    showExportMsg('この環境ではファイル保存機能が利用できません。', false);
    return;
  }
  try{
    await downloadsCap.save({filename, data});
    showExportMsg(filename+' を保存しました。', true);
  }catch(err){
    if (err && err.code==='declined') return;
    showExportMsg('保存に失敗しました: '+(err&&err.message?err.message:'unknown'), false);
  }
}

/* ---- "Save As" / "Overwrite", using the File System Access API where
   available (Chrome/Edge) so overwrite can write straight back to the same
   file without a picker dialog. Falls back to a plain download (effectively
   always "save as") in browsers without that API, such as Firefox/Safari,
   or inside Claude's own preview. ---- */
const savedFileHandles = {};
async function writeToFileHandle(handle, content){
  const writable = await handle.createWritable();
  await writable.write(content);
  await writable.close();
}
async function saveAs(key, filename, content, mimeType, ext, extLabel, btn){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mimeType});
  if (window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: extLabel, accept: {[mimeType]: ['.'+ext]} }]
      });
      await writeToFileHandle(handle, blob);
      savedFileHandles[key] = handle;
      if (btn) flashBtn(btn, '保存しました');
      return true;
    }catch(e){
      if (e && e.name==='AbortError') return false; // user cancelled the picker
      // any other error: fall through to the plain-download fallback below
    }
  }
  // fallback: ordinary browser download; no handle to remember for overwrite
  savedFileHandles[key] = null;
  await saveFile(filename, blob);
  return true;
}
async function saveOverwrite(key, filename, content, mimeType, ext, extLabel, btn){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mimeType});
  const handle = savedFileHandles[key];
  if (handle){
    try{
      await writeToFileHandle(handle, blob);
      if (btn) flashBtn(btn, '上書き保存しました');
      return;
    }catch(e){
      // the handle is no longer usable (file moved/deleted, permission lost) —
      // fall through and treat this like a fresh "save as" below
    }
  }
  // no remembered file yet — first "overwrite" behaves like "save as" and
  // establishes the file to overwrite from now on
  await saveAs(key, filename, content, mimeType, ext, extLabel, btn);
}
async function saveJsonAs(key, filename, content, btn){
  return await saveAs(key, filename, content, 'application/json', 'json', 'JSON', btn);
}
async function saveJsonOverwrite(key, filename, content, btn){
  await saveOverwrite(key, filename, content, 'application/json', 'json', 'JSON', btn);
}

$('#expCsv').addEventListener('click', ()=>{
  if (!lastResults) return;
  const {cols, rows} = lastResults;
  let csv = '\uFEFF#,区間,'+cols.map(c=>COL_META[c].label).join(',')+'\n';
  let n = 0;
  rows.forEach(r=>{
    const noLabel = r.isSummary ? '' : (++n)+'.';
    const label = r.isSummary ? r.name : intervalDisplayName(r, n-1);
    csv += noLabel+',"'+label.replace(/"/g,'""')+'",'+cols.map(c=>{
      const v = r[c];
      return v==null? '' : (typeof v==='number'? v.toFixed(2) : v);
    }).join(',')+'\n';
  });
  saveAs('csv', S.fileBaseName+'-区間分析.csv', csv, 'text/csv', 'csv', 'CSV', $('#expCsv'));
});

$('#expJpg').addEventListener('click', async ()=>{
  const el = document.getElementById('resultsTable');
  if (!el || !window.html2canvas) return;
  const canvas = await html2canvas(el, {backgroundColor: cssVar('--surface') || '#ffffff', scale:2});
  canvas.toBlob(blob=>{ saveAs('png', S.fileBaseName+'-区間分析.png', blob, 'image/png', 'png', 'PNG', $('#expJpg')); }, 'image/png');
});

})();
</script>
