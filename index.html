<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>区間分析 — FITファイル インターバルアナライザー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4; --border:#d7dde3;
  --text:#161a1f; --text-dim:#5b6570; --text-faint:#8a94a0;
  --speed:#0e9e8c; --cadence:#7c5cff; --hr:#e0435a; --power:#e08a1e; --elevation:#a9762d;
  --accent:#0e9e8c; --danger:#e0435a; --radius:10px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151a; --surface:#1a1f26; --surface-2:#212832; --border:#2b323d;
    --text:#e9edf1; --text-dim:#a0aab6; --text-faint:#6b7480;
  }
}
:root[data-theme="dark"]{
  --bg:#12151a; --surface:#1a1f26; --surface-2:#212832; --border:#2b323d;
  --text:#e9edf1; --text-dim:#a0aab6; --text-faint:#6b7480;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%; overflow-x:clip; width:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5;
  overflow-x:clip; width:100%;
}
h1,h2,h3,.disp{ font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif; letter-spacing:.01em; }
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.wrap{ max-width:1320px; margin:0 auto; padding:0 16px 56px; min-width:0; }
/* System messages now float over whatever's on screen (the map, on page 2)
   instead of living in a dedicated header bar, which has been removed. */
.headerMsg{ position:fixed; top:calc(8px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
  z-index:50; max-width:calc(100% - 24px); white-space:nowrap; overflow-x:auto; font-size:12px; font-weight:600;
  color:#fff; padding:7px 14px; border-radius:8px; background:rgba(60,60,60,.55); pointer-events:none;
  opacity:0; transition:opacity .4s ease; } /* normal-operation messages stay low-key */
.headerMsg.err{ background:rgba(200,40,40,.72); } /* actual errors/warnings still stand out in red */
.headerMsg.visible{ opacity:1; }
.headerMsg.fading{ opacity:0; }
#p1TopRow{ display:flex; align-items:center; gap:4px; margin-bottom:8px; }
.icon-btn{ width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center; font-size:17px; flex:none; }
.mapCtrlBtn{ background:rgba(255,255,255,.82); color:#222; border-color:rgba(0,0,0,.15); width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; }
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px; overflow:hidden; min-width:0; }
/* page 2 is the map+graph+interval working screen — the goal is fitting all
   three without scrolling, so it drops the card chrome entirely. */
#page2 .panel{ background:transparent; border:none; padding:0; margin-bottom:6px; border-radius:0; }
.panel h2{ font-size:18px; font-weight:600; margin:0 0 12px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap;}

.drop{
  border:1.5px dashed var(--border); border-radius:var(--radius); padding:32px 16px; text-align:center;
  cursor:pointer; color:var(--text-dim); transition:border-color .15s, background .15s;
}
.drop.drag{ border-color:var(--accent); background:var(--surface-2); }
.drop strong{ color:var(--text); font-weight:600; }
.drop input{ display:none; }
.fileinfo{ font-size:12.5px; color:var(--text-dim); margin-top:10px; }

html,body{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
/* page 2: no browser pinch-zoom of the page itself (pan only). iOS Safari
   ignores user-scalable=no, but it does honour a touch-action without
   pinch-zoom — see also the gesturestart guard in showPage's section. */
html.noPageZoom, html.noPageZoom body, html.noPageZoom button{ touch-action:pan-x pan-y; }
*{ -webkit-tap-highlight-color:transparent; } /* iOS's default gray tap-flash was very likely the "whole area looks selected" flash reported on #axisBottomBtn, which spans the full width */
button{
  font-family:inherit; font-size:13px; font-weight:600; color:var(--text); background:var(--surface-2);
  border:1px solid var(--border); border-radius:8px; padding:7px 13px; cursor:pointer;
  transition:background .12s, border-color .12s, opacity .12s;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
button:active{ transform:translateY(1px); }
button:disabled{ opacity:.4; cursor:not-allowed; }
button.primary{ background:var(--accent); border-color:var(--accent); color:#08211d; }
button.ghost{ background:transparent; }
button.small{ padding:4px 9px; font-size:12px; }
input[type=text], input[type=number], select{
  font-family:inherit; font-size:16px; color:var(--text); background:var(--surface-2);
  border:1px solid var(--border); border-radius:7px; padding:6px 8px; width:100%;
}
input:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
label.field{ display:flex; flex-direction:column; gap:3px; font-size:11.5px; color:var(--text-dim); }

.seg{ display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.seg button{ border:none; border-radius:0; background:var(--surface-2); }
.seg button + button{ border-left:1px solid var(--border); }
.seg button.on{ background:var(--accent); color:#08211d; }

#routeWrap{ position:relative; width:100%; aspect-ratio:16/10; background:var(--surface-2); border-radius:8px; overflow:hidden; touch-action:none; cursor:grab; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.routePreview{ position:relative; width:100%; aspect-ratio:16/9; background:var(--surface-2); border-radius:8px; overflow:hidden; }
#routeWrap.empty{ display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:13px; }
#routeSvg{ width:100%; height:100%; display:block; }
.crosshair-badge{
  position:absolute; pointer-events:none; background:rgba(0,0,0,.78); color:#fff; font-size:11.5px;
  padding:6px 9px; border-radius:7px; transform:translate(-50%,-115%); white-space:nowrap; line-height:1.45;
  display:none; z-index:5;
}
.crosshair-badge b{ font-weight:700; }

#chartWrap{ position:relative; height:230px; padding-top:30px; box-sizing:border-box; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.chart-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
.chart-toolbar-scroll{ flex-wrap:nowrap; overflow-x:auto; justify-content:center; padding-bottom:2px; }
.chart-toolbar-scroll button{ flex:none; }
.hint{ font-size:11.5px; color:var(--text-faint); }

.summaryGrid{ display:flex; flex-wrap:wrap; gap:10px 26px; }
.summaryGrid > div{ display:flex; flex-direction:column; gap:2px; min-width:88px; }
.summaryGrid .k{ font-size:11px; color:var(--text-dim); }
.summaryGrid .v{ font-size:14px; font-weight:700; }

table{ width:100%; border-collapse:collapse; font-size:12.5px; }
th,td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
#resultsTable{ width:max-content; min-width:100%; }
#resultsTable th, #resultsTable td{ white-space:nowrap; }
#resultsTable th.noCol, #resultsTable td.noCol{
  position:sticky; left:0; z-index:2; background:var(--surface);
  width:26px; min-width:26px; max-width:26px; text-align:center; padding:7px 3px;
}
#resultsTable th:nth-child(2), #resultsTable td.rowname{
  position:sticky; left:26px; z-index:2; background:var(--surface);
  white-space:normal; word-break:break-word; max-width:30vw;
  max-height:3.4em; overflow-y:auto;
  box-shadow:2px 0 4px rgba(0,0,0,.08);
}
#resultsTable tr.summaryRow td.rowname, #resultsTable tr.summaryRow td.noCol{ background:var(--surface-2); }
th{ color:var(--text-dim); font-weight:600; font-size:11.5px; text-transform:none; }
tr:last-child td{ border-bottom:none; }
.summaryRow td{ font-weight:700; background:var(--surface-2); border-top:2px solid var(--border); }
td.num{ text-align:right; font-variant-numeric:tabular-nums; }
.rowname input{ font-weight:600; }
.metricChecks{ margin-bottom:12px; }
@media (max-width:640px){ .metricChecks{ columns:2; } }
@media (max-width:420px){ .metricChecks{ columns:1; } }
.metricChecks label{ display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; }
.colRow{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:3px 4px; border-radius:6px; break-inside:avoid; -webkit-column-break-inside:avoid; margin-bottom:1px; }
.colRow.dragging{ opacity:.3; }
.dragGhost{ box-shadow:0 6px 18px rgba(0,0,0,.28); opacity:.96; background:var(--surface); border-radius:8px; }
.dragHandle{ flex:none; cursor:grab; touch-action:none; padding:2px 10px; font-size:16px; color:var(--text-faint);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.termInfoBtn{ flex:none; width:20px; height:20px; padding:0; border-radius:50%; font-size:11.5px; font-weight:700;
  line-height:1; display:flex; align-items:center; justify-content:center; color:var(--text-dim);
  background:var(--surface-2); border:1px solid var(--border); }

.exportRow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.msg{ font-size:12.5px; padding:8px 10px; border-radius:7px; margin-top:10px; }
#intervalErr{ display:none !important; }
.msg.err{ background:#e0435a22; color:var(--hr); }
.overflowX{ overflow-x:auto; }
.resultsScrollWrap{ scrollbar-width:none; -ms-overflow-style:none; }
.resultsScrollWrap::-webkit-scrollbar{ display:none; }
.resultsScrollTrack{ position:relative; height:5px; margin-top:4px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
.resultsScrollThumb{ position:absolute; top:0; left:0; height:100%; background:var(--text-faint); border-radius:3px; }

/* Page 2's own layout: a fixed vertical ratio of 6:2:10:1:1 (map / status /
   chart+timeline merged block / seek buttons / confirm button), filling the
   space below the sticky header rather than free-flowing like the rest of the
   app — this page is meant to be used "in place", not scrolled through. */
/* header is 10px+safe-area top padding + a 34px button row + 10px bottom
   padding + 14px margin-bottom = 68px, plus the safe-area inset itself;
   .wrap's own bottom padding is reclaimed via .wrap.p2Active below, since
   page 2 is meant to fill the screen in place rather than scroll */
/* bottom toolbar is fixed to the screen's own bottom edge, outside the
   20-unit ratio, so #p2Layout's height is reduced by its own height (52px
   + safe-area) on top of the header's footprint */
/* no more header to subtract — just the bottom toolbar's own footprint and the top safe area */
#p2Layout{ display:flex; flex-direction:column; height:calc(100dvh - env(safe-area-inset-top,0px) - 12px - 52px - env(safe-area-inset-bottom,0px)); min-height:420px; gap:4px; }
.wrap.p2Active{ padding-bottom:8px; }
.p2Block{ min-height:0; overflow:hidden; }
#p2Map{ flex:6 1 0; position:relative; border-radius:8px; overflow:hidden; background:var(--surface-2); }
#p2Map #routeWrap{ position:absolute; inset:0; aspect-ratio:auto; border-radius:0; }
#p2Status{ flex:2 1 0; display:flex; align-items:center; }
#p2StatusRow{ display:flex; align-items:center; width:100%; text-align:center; }
#p2StatusRow > div{ width:25%; flex:none; } /* fixed equal width per slot, so digit-count changes never shift positions */
#p2StatusRow .k{ display:block; font-size:10px; color:var(--text-dim); }
#p2StatusRow .v{ display:block; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
#p2StatusRow .vSub{ display:block; font-size:10px; font-weight:600; color:var(--text-dim); font-variant-numeric:tabular-nums; }
/* Chart (speed/elevation lines) and timeline (interval tracks) merged into
   one visually continuous block: a single bordered container holding the
   plot, a shared x-axis label strip, and the timeline tracks stacked
   directly beneath it with no visual seam between them. */
#p2ChartTimeline{ flex:10 1 0; display:flex; flex-direction:column; min-height:0; position:relative;
  border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface-2); }
#chartWrap{ flex:1 1 0; min-height:0; }
#p2ChartTimeline #chartWrap{ height:auto; padding-top:0; }
/* invisible, reliable tap targets over each axis title/label — a plain
   HTML button click, not a canvas gesture, so it never competes with the
   seek-drag or momentum-scroll logic. Sized generously but kept out of the
   plot's central/lower area where seek-drag needs to work freely. */
/* top-center, clear of the left/right axis-switch overlays (each 26%
   width) and the center 48% gap between them, and below the title row. */
.chartResetBtn{ position:absolute; top:2px; left:50%; transform:translateX(-50%); z-index:4; width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:13px; padding:0;
  background:var(--surface); border:1px solid var(--border); color:var(--text); }
/* the shared x-axis time strip — sits between the chart and the timeline
   tracks, doubling as the x-axis mode switch button (tap to change
   clock/elapsed/distance), replacing the old axisBottomBtn overlay */
#xAxisLabels{ flex:none; height:18px; position:relative; width:100%; border:none; padding:0; overflow:hidden;
  background:transparent; }
/* tick marks + labels scroll with the chart: each tick is a 1px line (the
   chart's vertical gridline continued through this strip) with its label to
   its right; labels run off the edge as the tick scrolls out of view */
#xAxisLabels .xTickLine{ position:absolute; top:0; bottom:0; width:1px; background:var(--border); pointer-events:none; }
#xAxisLabels .xTickLabel{ position:absolute; top:50%; transform:translateY(-50%); padding-left:3px; font-size:10px;
  color:var(--text-faint); white-space:nowrap; pointer-events:none; }
#p2SeekCtrl{ flex:1 1 0; display:flex; align-items:center; }
#p2SeekCtrl .chart-toolbar{ width:100%; }
#timelineScroll{ flex:1 1 0; min-height:0; overflow:hidden; position:relative;
  touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; } /* this page has no vertical scroll by design — the browser must never claim a swipe here as a page-scroll attempt */
#timelineTracks{ position:relative; height:100%; z-index:1; }
/* canvases behind (gridlines) and in front of (heart-rate fill) the clips */
#tlGridCanvas, #tlHrCanvas{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
#tlGridCanvas{ z-index:0; }
#tlHrCanvas{ z-index:2; }
.tlTrack{ position:absolute; left:0; right:0; box-sizing:border-box; }
.tlSeekLine{ position:absolute; top:0; bottom:0; width:2px; background:#e08a1e; z-index:5; pointer-events:none; }
.tlClip{ position:absolute; top:2px; bottom:2px; display:flex; align-items:stretch; border-radius:5px; box-sizing:border-box;
  background:var(--accent); opacity:.4; border:1.5px solid var(--accent); overflow:hidden; touch-action:none; }
.tlClip.tlHighlight{ opacity:1; box-shadow:0 0 0 2px #08211d inset; }
.tlClip.tlLocked .tlClipHandle{ opacity:.35; } /* only the highlighted clip's edges are editable */
/* handles sit at the clip's real start/end, so they only appear once that
   edge scrolls into view (the clip itself extends past the visible window) */
.tlClipHandle{ position:absolute; top:0; bottom:0; width:16px; display:flex; align-items:center; justify-content:center; font-size:10px;
  font-weight:700; color:#08211d; background:rgba(255,255,255,.35); touch-action:none; }
.tlClipName{ position:absolute; top:50%; transform:translateY(-50%); text-align:center; font-size:10.5px;
  font-weight:700; color:#08211d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } /* left/width set per frame in renderTimeline */
.tlClipHandle[data-edge="start"]{ left:0; }
.tlClipHandle[data-edge="end"]{ right:0; }
#p2Confirm{ flex:1 1 0; display:flex; align-items:stretch; gap:6px; }
#p2Confirm .halfBtn{ flex:1; margin:0; }
#backToPage1Btn{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
#p2BottomToolbar{ position:fixed; left:0; right:0; bottom:0; z-index:15; display:flex; align-items:center;
  justify-content:space-between; gap:6px; padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));
  background:var(--bg); border-top:1px solid var(--border); }
.tbBtn{ flex:none; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:18px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:0; }
.tbBtnCenter{ width:58px; height:58px; font-size:26px; background:var(--accent); color:#08211d; border-color:var(--accent); }
.tbBtnSmall{ width:26px; height:26px; font-size:12px; margin:0 -2px; }
.tbBtnSmall:disabled{ opacity:.4; }
#p2BottomToolbar{ padding-left:10px; padding-right:10px; }
/* Phone-width layout: shrink everything enough that map + graph + at least
   one interval card are all visible together without scrolling, since that's
   the working set someone on a phone actually needs at once. */
@media (max-width:600px){
  .wrap{ padding:8px 10px 24px; }
  .panel{ padding:9px; margin-bottom:8px; }
  .panel-head{ margin-bottom:6px; }
  .panel-head h2{ font-size:14.5px; }
  #summaryPanel .panel-head{ margin-bottom:4px; }
  .summaryGrid{ flex-wrap:wrap; gap:8px 16px; }
  .summaryGrid > div{ min-width:auto; }
  .summaryGrid .k{ font-size:9.5px; }
  .summaryGrid .v{ font-size:11.5px; }
  .crosshair-badge{ font-size:10px; }
  .chart-toolbar{ margin-top:4px; }
  .chart-toolbar .hint{ font-size:10px; }
  .seg button{ padding:5px 8px; font-size:11px; }
}
.wheelModal{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:70; display:flex; align-items:center; justify-content:center; padding:20px; }
.wheelModalBox{ background:var(--surface); border-radius:14px; width:260px; max-width:100%; overflow:hidden; }
.wheelHeader{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; font-weight:700; }
.wheelWindow{ position:relative; height:180px; }
.wheelScroll{ height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;
  padding:77px 0; -ms-overflow-style:none; scrollbar-width:none; }
.wheelScroll::-webkit-scrollbar{ display:none; }
.wheelItem{ height:26px; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700;
  scroll-snap-align:center; color:var(--text-faint); -webkit-user-select:none; user-select:none; transition:color .1s, font-size .1s; }
.wheelItem.centered{ color:var(--text); font-size:22px; }
.wheelHighlightBand{ position:absolute; left:0; right:0; top:77px; height:26px; border-top:1px solid var(--border);
  border-bottom:1px solid var(--border); pointer-events:none; background:rgba(127,127,127,.06); }
.setBtn{ font-weight:700; background:var(--accent); border-color:var(--accent); color:#08211d; padding:6px 14px; font-size:12px; }
.wideConfirm{ display:block; width:100%; text-align:center; padding:10px 6px; font-weight:600; font-size:13px;
  background:var(--accent); border:1px solid var(--accent); color:#08211d; border-radius:7px; cursor:pointer; }
.hidden{ display:none !important; }
.axisPicker{ position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:6; border-radius:8px; }
.axisPicker > div{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; flex-wrap:wrap; gap:6px; max-width:88%; justify-content:center; }
.axisPicker button{ padding:9px 16px; font-size:13.5px; }
.confirmModal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.confirmBox{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; max-width:340px; width:100%; }
.confirmBox p{ margin:0 0 16px; font-size:13.5px; line-height:1.6; }
.confirmBtns{ display:flex; gap:8px; justify-content:flex-start; flex-wrap:wrap; }
.confirmBtns button{ flex:1 1 auto; padding:9px 10px; font-size:12.5px; }
.ivReorderModal{ position:fixed; inset:0; background:var(--bg); z-index:60; display:flex; flex-direction:column;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px)); padding-top:calc(14px + env(safe-area-inset-top,0px)); }
.ivReorderHead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex:none; }
.ivReorderHead h2{ font-size:17px; margin:0; }
footer{ text-align:center; color:var(--text-faint); font-size:11.5px; margin-top:22px; }
/* All :hover styling lives here, gated to devices that genuinely support a
   hover pointer (mouse/trackpad). On touch-only devices (effectively all
   phones, including iOS), an unguarded :hover rule can visually "stick" to
   an element after a tap and not clear until something else forces a
   re-render — and while it's stuck, the very next tap on that element is
   consumed just clearing the stuck hover state rather than acting as a
   real click, so the button needs a second tap to actually respond. This
   was the actual cause of the "結果を見る" double-tap bug — nothing to do
   with the swipe gesture code after all. */
@media (hover:hover){
  .drop:hover{ border-color:var(--accent); background:var(--surface-2); }
  button:hover{ border-color:var(--accent); }
  button.primary:hover{ opacity:.9; border-color:var(--accent); }
  .colRow:hover{ background:var(--surface-2); }
  .setBtn:hover{ opacity:.9; }
  .wideConfirm:hover{ opacity:.92; }
}
</style>
</head>
<body>
<div class="wrap">

<div id="headerMsg" class="headerMsg"><span id="headerMsgText"></span></div>

<script>
(function(){
"use strict";

// This app's own sequential version number — counts every published version
// of this file, across every session, starting from the very first one.
// 93 is a verified count (grepped from the three prior sessions' saved
// transcripts, which all show this exact same artifact link). The current
// session isn't saved as a searchable transcript yet, so its contribution
// (this session's own publish count so far) is reconstructed from the
// conversation itself rather than mechanically verified — best-effort, not
// guaranteed exact. Increment by exactly 1 on every future publish.
const APP_VERSION = 143;

/* ============ FIT PARSER ============ */
const FIT_EPOCH = 631065600; // seconds between 1970-01-01 and 1989-12-31 (FIT epoch)

const BASE_TYPES = {
  0x00:{size:1,name:'enum',invalid:0xFF,read:(v,o)=>v.getUint8(o)},
  0x01:{size:1,name:'sint8',invalid:0x7F,read:(v,o)=>v.getInt8(o)},
  0x02:{size:1,name:'uint8',invalid:0xFF,read:(v,o)=>v.getUint8(o)},
  0x83:{size:2,name:'sint16',invalid:0x7FFF,read:(v,o,le)=>v.getInt16(o,le)},
  0x84:{size:2,name:'uint16',invalid:0xFFFF,read:(v,o,le)=>v.getUint16(o,le)},
  0x85:{size:4,name:'sint32',invalid:0x7FFFFFFF,read:(v,o,le)=>v.getInt32(o,le)},
  0x86:{size:4,name:'uint32',invalid:0xFFFFFFFF,read:(v,o,le)=>v.getUint32(o,le)},
  0x07:{size:1,name:'string',invalid:0x00,read:(v,o)=>v.getUint8(o)},
  0x88:{size:4,name:'float32',invalid:0xFFFFFFFF,read:(v,o,le)=>v.getFloat32(o,le)},
  0x89:{size:8,name:'float64',invalid:null,read:(v,o,le)=>v.getFloat64(o,le)},
  0x0A:{size:1,name:'uint8z',invalid:0x00,read:(v,o)=>v.getUint8(o)},
  0x8B:{size:2,name:'uint16z',invalid:0x0000,read:(v,o,le)=>v.getUint16(o,le)},
  0x8C:{size:4,name:'uint32z',invalid:0x00000000,read:(v,o,le)=>v.getUint32(o,le)},
  0x0D:{size:1,name:'byte',invalid:0xFF,read:(v,o)=>v.getUint8(o)},
  0x8E:{size:8,name:'sint64',invalid:null,read:(v,o,le)=>Number(v.getBigInt64(o,le))},
  0x8F:{size:8,name:'uint64',invalid:null,read:(v,o,le)=>Number(v.getBigUint64(o,le))},
  0x90:{size:8,name:'uint64z',invalid:0,read:(v,o,le)=>Number(v.getBigUint64(o,le))},
};

function parseFit(buffer){
  const view = new DataView(buffer);
  if (buffer.byteLength < 14) throw new Error('ファイルが小さすぎます');
  const headerSize = view.getUint8(0);
  const sig = String.fromCharCode(view.getUint8(8),view.getUint8(9),view.getUint8(10),view.getUint8(11));
  if (sig !== '.FIT') throw new Error('FIT形式のファイルではないようです');
  const dataSize = view.getUint32(4, true);
  let offset = headerSize;
  const dataEnd = headerSize + dataSize;
  const localDefs = {};
  const records = [];
  const laps = [];
  let lastTimestamp = null;

  function readMsg(def){
    let bytesRead = 0;
    const msg = {};
    for (const f of def.fields){
      const info = BASE_TYPES[f.baseType];
      let val = null;
      if (info && info.name === 'string'){
        let chars = [];
        for (let i=0;i<f.size;i++){
          const c = view.getUint8(offset+bytesRead+i);
          if (c===0) break;
          chars.push(String.fromCharCode(c));
        }
        val = chars.join('');
      } else if (info){
        try{ val = info.read(view, offset+bytesRead, def.le); }catch(e){ val = null; }
        if (info.invalid !== null && info.invalid !== undefined && val === info.invalid) val = null;
      }
      bytesRead += f.size;
      msg[f.fieldNum] = val;
    }
    if (def.devFields && def.devFields.length){
      for (const df of def.devFields) bytesRead += df.size;
    }
    return {msg, bytesRead};
  }

  while (offset < dataEnd && offset < buffer.byteLength){
    const headerByte = view.getUint8(offset); offset += 1;
    const isCompressed = (headerByte & 0x80) !== 0;
    if (isCompressed){
      const localType = (headerByte >> 5) & 0x03;
      const timeOffset = headerByte & 0x1F;
      const def = localDefs[localType];
      if (!def){ break; }
      if (lastTimestamp === null) lastTimestamp = 0;
      const baseOffset = lastTimestamp & 0x1F;
      let newTs = (timeOffset >= baseOffset) ? (lastTimestamp - baseOffset + timeOffset) : (lastTimestamp - baseOffset + timeOffset + 32);
      lastTimestamp = newTs;
      const {msg, bytesRead} = readMsg(def);
      offset += bytesRead;
      if (def.globalNum === 20) pushRecord(msg, newTs);
      continue;
    }
    const isDefinition = (headerByte & 0x40) !== 0;
    const localType = headerByte & 0x0F;
    if (isDefinition){
      offset += 1; // reserved
      const arch = view.getUint8(offset); offset += 1;
      const le = arch === 0;
      const globalNum = view.getUint16(offset, le); offset += 2;
      const numFields = view.getUint8(offset); offset += 1;
      const fields = [];
      for (let i=0;i<numFields;i++){
        const fieldNum = view.getUint8(offset); offset+=1;
        const size = view.getUint8(offset); offset+=1;
        const baseType = view.getUint8(offset); offset+=1;
        fields.push({fieldNum,size,baseType});
      }
      let devFields = [];
      if (headerByte & 0x20){
        const numDev = view.getUint8(offset); offset+=1;
        for (let i=0;i<numDev;i++){
          const dFieldNum = view.getUint8(offset); offset+=1;
          const dSize = view.getUint8(offset); offset+=1;
          offset+=1; // developer data index, not needed
          devFields.push({fieldNum:dFieldNum, size:dSize});
        }
      }
      localDefs[localType] = {globalNum, le, fields, devFields};
    } else {
      const def = localDefs[localType];
      if (!def){ break; }
      const {msg, bytesRead} = readMsg(def);
      offset += bytesRead;
      if (def.globalNum === 20){
        const ts = msg[253];
        if (ts !== null && ts !== undefined) lastTimestamp = ts;
        pushRecord(msg, ts !== null && ts !== undefined ? ts : lastTimestamp);
      } else if (def.globalNum === 19){
        // lap message: field 2 is start_time (a manual lap press on the
        // head unit, or an auto-lap trigger) — same FIT-epoch offset as
        // record timestamps
        if (msg[2] != null) laps.push(msg[2]);
      }
    }
  }

  function pushRecord(msg, ts){
    if (ts === null || ts === undefined) return;
    records.push({
      t: ts + FIT_EPOCH,
      lat: msg[0]!=null ? msg[0]*(180/2147483648) : null,
      lon: msg[1]!=null ? msg[1]*(180/2147483648) : null,
      alt: msg[2]!=null ? msg[2]/5-500 : (msg[78]!=null ? msg[78]/5-500 : null),
      hr: msg[3]!=null ? msg[3] : null,
      cad: msg[4]!=null ? msg[4] : null,
      dist: msg[5]!=null ? msg[5]/100 : null,
      speed: msg[6]!=null ? msg[6]/1000 : (msg[73]!=null ? msg[73]/1000 : null),
      power: msg[7]!=null ? msg[7] : null,
      temp: msg[13]!=null ? msg[13] : null,
    });
  }

  if (!records.length) throw new Error('走行記録(record)が見つかりませんでした');
  records.sort((a,b)=>a.t-b.t);
  const t0 = records[0].t;
  records.forEach(r=> r.elapsed = r.t - t0);

  // distance fallback via haversine if missing entirely
  const hasDist = records.some(r=>r.dist!=null);
  if (!hasDist){
    let cum = 0, prev = null;
    for (const r of records){
      if (r.lat!=null && r.lon!=null && prev){
        cum += haversine(prev.lat, prev.lon, r.lat, r.lon);
      }
      r.dist = cum;
      if (r.lat!=null && r.lon!=null) prev = r;
    }
  } else {
    // forward-fill small gaps
    let last = 0;
    for (const r of records){ if (r.dist==null) r.dist = last; else last = r.dist; }
  }
  // manual/auto laps from the head unit, if any — attached as a property on
  // the returned array so every existing call site (expecting a plain
  // records array) keeps working unchanged
  const uniqueLapStarts = [...new Set(laps)].sort((a,b)=>a-b);
  records.laps = uniqueLapStarts.map(ts=>({ t: ts+FIT_EPOCH, elapsed: (ts+FIT_EPOCH)-t0 })).filter(l=>l.elapsed>=0 && l.elapsed<=records[records.length-1].elapsed);
  return records;
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ============ STATE ============ */
const S = {
  records: [], // full resolution
  hasGps: false,
  metrics: ['speed','elevation'], // active metric keys, in order (order decides left/right axis placement)
  resultColumns: null, // set below from COLUMN_DEFS
  ftp: null,
  weight: null,
  numberingStyle: 'circled', // 'off' | 'arabic' | 'circled' | 'kanji'
  summaryRowMode: 'last', // 'off' | 'first' | 'last'
  dirty: false, // true once something has changed since the last JSON save
  powerChartMetrics: ['avgPower','elevation'], // up to 4, order = axis stacking order
  powerChartXMode: 'clock', // 'clock' | 'elapsed' | 'dist'
  powerChartWidthMult: 1, // adjustable via the -/+ width buttons; 1 = the base 800px-wide layout
  powerChartSubdivideN: 2, // dial value — how many pieces to split the TARGET interval into
  powerChartSubdivideTargetIdx: null, // which S.intervals index is currently SELECTED (highlighted, not yet split)
  timelineSelectedId: null, // tap-selected interval id on page 2's timeline, if any
  powerChartSubdivisions: {}, // { [S.intervals index]: N } — every interval currently split, and into how many pieces; multiple can be split at once
  grossIncludesStoppedTime: true, // whether the displayed "停止時間" column uses the stoppedTime2 (true) or stoppedTime1 (false) definition
  avgGradientMethod: 'diff', // 'diff' (start/end elevation difference) | 'gain' (cumulative climb / distance)
  currentIntervalIndex: 0, // which interval the mobile pager is currently showing
  xMode: 'clock',
  fileBaseName: '区間分析', // basis for suggested filenames, set from the uploaded FIT file's name
  cityName: null, // reverse-geocoded departure city/town, for the results-graph title
  laps: [], // {t, elapsed} for each lap marker found in the FIT file (manual or auto-lap), if any
  intervals: [],
  nextId: 1,
  armed: null, // {intervalId, field}
  selection: null, // {idx}
  chart: null,
  mapView: null, // {cx, cy, zoom, minZoom, maxZoom} world-pixel center at current zoom
  routeLonLat: [], // downsampled {lon,lat,idx}
  routeWorldPts: [], // {wx,wy,idx} at current zoom
  routeWorldZoom: null,
};

const METRIC_META = {
  speed:{label:'速度', unit:'km/h', color:'--speed', get:r=>r.speed!=null?r.speed*3.6:null, fmt:v=>v==null?'--':v.toFixed(1)},
  cadence:{label:'ケイデンス', unit:'rpm', color:'--cadence', get:r=>r.cad, fmt:v=>v==null?'--':Math.round(v)},
  hr:{label:'心拍', unit:'bpm', color:'--hr', get:r=>r.hr, fmt:v=>v==null?'--':Math.round(v)},
  power:{label:'パワー', unit:'W', color:'--power', get:r=>r.power, fmt:v=>v==null?'--':Math.round(v)},
  elevation:{label:'標高', unit:'m', color:'--elevation', get:r=>r.alt, fmt:v=>v==null?'--':Math.round(v)},
};

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function fmtHMS(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h>0? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}
function fmtClock(unixSec){
  const d = new Date(unixSec*1000);
  return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function fmtClockNoSec(unixSec){
  const d = new Date(unixSec*1000);
  return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtKm(m){ return (m/1000).toFixed(1); }
function fmtDate(unixSec){
  const d = new Date(unixSec*1000);
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
}

function renderRoutePreview(){
  const el = $('#routePreviewWrap');
  if (!el) return;
  if (!S.hasGps){
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-faint);font-size:13px;">この記録には位置情報(GPS)がありません</div>';
    return;
  }
  const gpsRecs = S.records.filter(r=>r.lat!=null && r.lon!=null);
  let minLat=90,maxLat=-90,minLon=180,maxLon=-180;
  gpsRecs.forEach(r=>{
    if (r.lat<minLat) minLat=r.lat; if (r.lat>maxLat) maxLat=r.lat;
    if (r.lon<minLon) minLon=r.lon; if (r.lon>maxLon) maxLon=r.lon;
  });
  const rect = el.getBoundingClientRect();
  const vw = rect.width || 300, vh = rect.height || 170;
  const zoom = fitZoomLevel(minLat,maxLat,minLon,maxLon, vw, vh);
  const midLat=(minLat+maxLat)/2, midLon=(minLon+maxLon)/2;
  const [cx,cy] = lonLatToWorld(midLon, midLat, zoom);
  const topLeftX = cx - vw/2, topLeftY = cy - vh/2;
  const n = Math.pow(2, zoom);
  const txMin = Math.floor(topLeftX/TILE_SIZE), txMax = Math.floor((topLeftX+vw)/TILE_SIZE);
  const tyMin = Math.max(0, Math.floor(topLeftY/TILE_SIZE)), tyMax = Math.min(n-1, Math.floor((topLeftY+vh)/TILE_SIZE));
  let tilesHtml = '';
  for (let tx=txMin; tx<=txMax; tx++){
    const wrappedX = ((tx % n)+n) % n;
    for (let ty=tyMin; ty<=tyMax; ty++){
      const left = tx*TILE_SIZE - topLeftX, top = ty*TILE_SIZE - topLeftY;
      tilesHtml += '<img src="https://tile.openstreetmap.org/'+zoom+'/'+wrappedX+'/'+ty+'.png" '+
        'style="position:absolute;left:'+left+'px;top:'+top+'px;width:'+TILE_SIZE+'px;height:'+TILE_SIZE+'px;pointer-events:none;" '+
        'draggable="false" loading="lazy" alt="">';
    }
  }
  const step = Math.max(1, Math.floor(gpsRecs.length/800));
  let d = '';
  for (let i=0;i<gpsRecs.length;i+=step){
    const r = gpsRecs[i];
    const [wx,wy] = lonLatToWorld(r.lon, r.lat, zoom);
    d += (d?'L':'M')+(wx-topLeftX)+' '+(wy-topLeftY)+' ';
  }
  const first = gpsRecs[0], last = gpsRecs[gpsRecs.length-1];
  const [sx0,sy0] = lonLatToWorld(first.lon, first.lat, zoom);
  const [sx1,sy1] = lonLatToWorld(last.lon, last.lat, zoom);
  // numbered markers at each interval's starting position — these reflect
  // S.intervals (which, after loading a JSON project, are whatever that
  // project actually defines, not necessarily the file's own laps) rather
  // than S.laps directly, so this stays correct after a JSON import too
  let lapMarkersHtml = '';
  if (S.intervals.length){
    S.intervals.forEach((iv,i)=>{
      const rec = nearestRecordByElapsedIn(gpsRecs, iv.start);
      if (!rec || rec.lat==null || rec.lon==null) return;
      const [lx,ly] = lonLatToWorld(rec.lon, rec.lat, zoom);
      const x = lx-topLeftX, y = ly-topLeftY;
      lapMarkersHtml += '<circle cx="'+x+'" cy="'+y+'" r="7" fill="'+cssVar('--accent')+'" stroke="#fff" stroke-width="1.5"/>'+
        '<text x="'+x+'" y="'+(y+0.5)+'" text-anchor="middle" dominant-baseline="middle" font-size="8.5" font-weight="700" fill="#08211d">'+(i+1)+'</text>';
    });
  }
  const svgHtml = '<svg viewBox="0 0 '+vw+' '+vh+'" width="'+vw+'" height="'+vh+'" style="position:absolute;top:0;left:0;pointer-events:none;" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="'+d+'" fill="none" stroke="'+cssVar('--speed')+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>'+
    '<circle cx="'+(sx0-topLeftX)+'" cy="'+(sy0-topLeftY)+'" r="5" fill="#3fbf6a" stroke="#fff" stroke-width="1.5"/>'+
    '<circle cx="'+(sx1-topLeftX)+'" cy="'+(sy1-topLeftY)+'" r="5" fill="'+cssVar('--hr')+'" stroke="#fff" stroke-width="1.5"/>'+
    lapMarkersHtml+
    '</svg>';
  el.innerHTML = tilesHtml + svgHtml +
    '<div style="position:absolute;bottom:4px;right:6px;font-size:9px;background:rgba(255,255,255,.82);color:#222;padding:1px 5px;border-radius:4px;">© OpenStreetMap contributors</div>';
}

let rideSummaryLoadSeq = 0; // bumped on every renderRideSummary() call, so an in-flight
                            // geocode request can reliably tell whether it's still for
                            // the currently-loaded file (robust against any incidental
                            // re-creation of the records array, unlike comparing object identity)
function renderRideSummary(){
  const mySeq = ++rideSummaryLoadSeq;
  const recs = S.records;
  const first = recs[0], last = recs[recs.length-1];
  const distance = last.dist - first.dist;
  let elevGain = 0;
  for (let i=1;i<recs.length;i++){
    if (recs[i].altSmooth!=null && recs[i-1].altSmooth!=null){
      const diff = recs[i].altSmooth-recs[i-1].altSmooth;
      if (diff>0) elevGain += diff;
    }
  }
  const avg = arr => arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const pwrs = recs.map(r=>r.power).filter(v=>v!=null);
  const avgPower = avg(pwrs);
  // net average speed: distance over moving time only, excluding both
  // large gaps (timer paused/off) and time spent stationary
  const TIMER_GAP_THRESHOLD = 30, MOVING_THRESHOLD = 0.5;
  let netTime = 0;
  for (let i=1;i<recs.length;i++){
    const dt = recs[i].elapsed - recs[i-1].elapsed;
    if (dt > TIMER_GAP_THRESHOLD) continue;
    const spd = recs[i].speed!=null ? recs[i].speed : recs[i-1].speed;
    if (spd!=null && spd>MOVING_THRESHOLD) netTime += dt;
  }
  const netAvgSpeed = netTime>0 ? distance/netTime*3.6 : null;

  $('#sumFileName').textContent = S.fileBaseName;
  $('#sumDate').textContent = fmtDate(first.t);
  $('#sumStart').textContent = fmtClock(first.t);
  $('#sumEnd').textContent = fmtClock(last.t);
  $('#sumDistance').textContent = fmtKm(distance)+' km';
  $('#sumElevGain').textContent = Math.round(elevGain)+' m';
  $('#sumAvgSpeed').textContent = netAvgSpeed!=null? netAvgSpeed.toFixed(1)+' km/h' : '--';
  $('#sumAvgPower').textContent = avgPower!=null? Math.round(avgPower)+' W' : '--';

  const cityEl = $('#sumCity');
  // If the very first record has no GPS fix yet (common right after
  // power-on, before satellites lock), fall back to whichever recorded
  // point is closest in time that does have one.
  const firstGps = (recs[0].lat!=null && recs[0].lon!=null) ? recs[0] : nearestGpsRecordTo(recs[0]);
  S.cityName = null;
  if (S.hasGps && firstGps){
    cityEl.textContent = '取得中…';
    fetchCityNameWithRetry(firstGps.lat, firstGps.lon, mySeq, cityEl, 0);
  } else {
    cityEl.textContent = '--';
  }
}
// Reverse-geocode the departure point via OSM Nominatim (needs network
// access — works once self-hosted, but this request is blocked by
// Claude's own preview sandbox the same way map tiles are). A single
// failed attempt is often just a transient network hiccup, so retry up to
// 10 more times, 1 second apart, before giving up.
function fetchCityNameWithRetry(lat, lon, mySeq, cityEl, attempt){
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&zoom=14&accept-language=ja')
    .then(res => res.ok ? res.json() : Promise.reject(new Error('HTTP '+res.status)))
    .then(data => {
      if (mySeq!==rideSummaryLoadSeq) return; // a newer file was loaded meanwhile
      const addr = (data && data.address) || {};
      const name = addr.city || addr.town || addr.village || addr.suburb || addr.county || '--';
      cityEl.textContent = name;
      S.cityName = name!=='--' ? name : null;
      if (lastResults) renderPowerChart(lastResults.rows.filter(r=>!r.isSummary));
    })
    .catch(()=>{
      if (mySeq!==rideSummaryLoadSeq) return;
      if (attempt < 10){
        setTimeout(()=> fetchCityNameWithRetry(lat, lon, mySeq, cityEl, attempt+1), 1000);
      } else {
        cityEl.textContent = '取得できませんでした';
        showHeaderMsg('市町村名の取得に失敗しました。通信環境をご確認ください。', true);
      }
    });
}

let mapChartInitialized = false;
// true while a long-press-drag seek gesture on the chart is active — lets
// setSelection() skip the expensive map re-render on every single move
// event during the drag (see below), which was making the drag feel
// unresponsive; the map catches up once with a single render on release.
let seekDragActive = false;
// Momentum/fling physics, based on published reference values rather than
// hand-tuned guesses:
//  - Deceleration constant: iOS's UIScrollView.decelerationRate "normal"
//    value, 0.998 — velocity is retained at a rate of 0.998 per
//    millisecond of elapsed time (so after 1000ms, ~13.5% of the original
//    speed remains: 0.998^1000). This is Apple's own documented constant
//    for native scroll views, not an approximation of it.
//  - Stop threshold: 0.01 px/ms — low enough that, combined with the slow
//    0.998 decay, the glide reads as a natural, gradual settle rather than
//    an abrupt cutoff (the previous ad-hoc 0.95-per-16ms decay was far
//    steeper: over 1000ms it retained only ~4% of the original speed,
//    roughly 3x faster-decaying than the iOS constant, which is very
//    likely why momentum felt weaker/shorter than the map's even after
//    the two were made to use the same formula shape).
// Tightened from iOS's 0.998 ("normal") to stop sooner: 0.996/ms leaves
// ~1.8% of the speed after 1s (vs ~13.5%) and roughly halves the glide
// distance (≈ v × 250ms instead of v × 500ms).
const MOMENTUM_DECELERATION = 0.996;
// must stay below MOMENTUM_TRIGGER_THRESHOLD, otherwise a flick between the
// two values passes the trigger check and then dies on the very first step
const MOMENTUM_STOP_THRESHOLD = 0.01;
// Text-reported results confirmed the render loop itself has no stall —
// once triggered, momentum ran 120-170 steps at a rock-steady 17ms each.
// "step 1, gap 0ms" on failed attempts just means the very first check
// already found velocity under the trigger threshold, so it never got
// going. Lowered from 0.02 (20px/s) to 0.006 (6px/s) so a normal, not
// especially hard flick reliably qualifies.
const MOMENTUM_TRIGGER_THRESHOLD = 0.03;
// Release-velocity tracker shared by the chart and the timeline. Improves on
// the earlier "first vs last sample within 80ms" reading, which under-read
// many real flicks:
//  - uses each event's own timeStamp (when the finger actually moved), not
//    performance.now() at handler time, which a busy main thread skews;
//  - reads getCoalescedEvents() so samples the browser merged into one
//    pointermove aren't thrown away;
//  - takes the larger of a least-squares slope over the last 100ms and the
//    speed over the last ~40ms, so the natural slow-down right before the
//    finger lifts doesn't cancel out the flick;
//  - only reports zero when the finger was genuinely held still before
//    lifting (no movement for VELOCITY_HOLD_MS).
const VELOCITY_WINDOW_MS = 100;
const VELOCITY_HOLD_MS = 90;
function createVelocityTracker(){
  let samples = [];
  function push(x, t){
    const last = samples[samples.length-1];
    if (last && t <= last.t){ last.x = x; return; } // same timestamp — keep the newest position
    samples.push({x, t});
    const cutoff = t - 300;
    while (samples.length>2 && samples[0].t < cutoff) samples.shift();
  }
  return {
    reset(x, t){ samples = [{x, t}]; },
    // offsetX: subtract from clientX (the element's rect.left)
    add(e, offsetX){
      const list = (typeof e.getCoalescedEvents==='function') ? e.getCoalescedEvents() : null;
      if (list && list.length) list.forEach(ev=>push(ev.clientX-offsetX, ev.timeStamp || e.timeStamp));
      else push(e.clientX-offsetX, e.timeStamp || performance.now());
    },
    count(){ return samples.length; },
    velocity(releaseT){
      if (samples.length<2) return 0;
      const last = samples[samples.length-1];
      if (releaseT!=null && releaseT-last.t > VELOCITY_HOLD_MS) return 0;
      let win = samples.filter(s=>s.t >= last.t-VELOCITY_WINDOW_MS);
      if (win.length<2) win = samples.slice(-2); // sparse events: fall back to the last segment
      if (win[win.length-1].t - win[0].t <= 0) return 0;
      // least-squares slope (px/ms) over the window
      const n = win.length;
      let mt=0, mx=0;
      win.forEach(s=>{ mt+=s.t; mx+=s.x; }); mt/=n; mx/=n;
      let num=0, den=0;
      win.forEach(s=>{ const dt=s.t-mt; num+=dt*(s.x-mx); den+=dt*dt; });
      const vFit = den>0 ? num/den : 0;
      // short-window endpoint speed
      let a = win[0];
      for (let i=win.length-2;i>=0;i--){ a = win[i]; if (last.t-win[i].t >= 40) break; }
      const vEnd = last.t>a.t ? (last.x-a.x)/(last.t-a.t) : 0;
      if (Math.sign(vFit)===Math.sign(vEnd)) return Math.abs(vEnd)>Math.abs(vFit) ? vEnd : vFit;
      return vEnd; // direction changed at the very end — trust the latest motion
    },
  };
}
// Scrolling the chart or the timeline drives the seek bar: the seek position
// is the data value at the centre of the screen, with the view following it.
// At the true start/end of the data the view stops (it never shows empty
// space past either end) and the seek bar slides on toward the left/right
// edge instead, until it reaches the first/last record.
let scrollSeeking = false; // true while a scroll drives the seek bar — map renders are throttled meanwhile
let scrollState = null;    // {c, min, max, idx} snapshot of the last scrollCenterTo()
function nearestIndexByX(x){
  const recs = S.records, dist = S.xMode==='dist';
  let lo=0, hi=recs.length-1;
  while (lo<hi){ const mid=(lo+hi)>>1; if ((dist?recs[mid].dist:recs[mid].elapsed)<x) lo=mid+1; else hi=mid; }
  if (lo>0){
    const a = dist?recs[lo-1].dist:recs[lo-1].elapsed, b = dist?recs[lo].dist:recs[lo].elapsed;
    if (x-a < b-x) lo--;
  }
  return lo;
}
// where the seek bar currently sits, in data units: the value it was last
// scrolled to if nothing has moved it since (it may be off-centre near the
// ends), otherwise the centre of the visible window
function currentScrollCenter(){
  const xs = S.chartView;
  if (scrollState && S.selection && scrollState.idx===S.selection.idx && scrollState.min===xs.min && scrollState.max===xs.max) return scrollState.c;
  return (xs.min+xs.max)/2;
}
function scrollCenterTo(c){
  const xs = S.chartView;
  const lo = xVal(S.records[0]), hi = xVal(S.records[S.records.length-1]);
  c = Math.max(lo, Math.min(hi, c));
  const span = xs.max-xs.min;
  xs.min = Math.max(lo, Math.min(hi-span, c-span/2));
  xs.max = xs.min+span;
  const idx = nearestIndexByX(c);
  scrollSeeking = true;
  if (!S.selection || S.selection.idx!==idx) setSelection(idx, null, 'chart'); // redraws chart + timeline, recentres the map
  else { redrawChart(); renderTimeline(); }
  scrollState = {c, min:xs.min, max:xs.max, idx};
}
function endScrollSeeking(){
  if (!scrollSeeking) return;
  scrollSeeking = false;
  if (S.hasGps && S.mapView) renderMapFrame(); // catch the map up once the scroll is over
}
// Shared momentum engine — used by both the chart's own drag and the
// timeline's pan gesture, since both just scroll the same view.
let momentumRAF = null;
function stopMomentum(){ if (momentumRAF!=null){ cancelAnimationFrame(momentumRAF); momentumRAF=null; } }
function startMomentum(v0, canvasWidth){
  if (!S.chartView || !canvasWidth) return;
  stopMomentum();
  let v = v0, lastT = null, c = currentScrollCenter();
  function finish(){ momentumRAF=null; endScrollSeeking(); redrawChart(); }
  function step(t){
    // The first frame's rAF timestamp is the frame's start time, which is
    // often equal to or even earlier than the performance.now() taken at
    // release. Use one nominal frame for the first step and never a
    // non-positive dt (a 0ms step used to read as "hit the edge").
    const rawDt = lastT==null ? 16 : t-lastT;
    lastT = t;
    if (rawDt <= 0){ momentumRAF = requestAnimationFrame(step); return; }
    const dt = Math.min(48, rawDt);
    v *= Math.pow(MOMENTUM_DECELERATION, dt);
    if (Math.abs(v) < MOMENTUM_STOP_THRESHOLD){ finish(); return; }
    const xs = S.chartView;
    const lo = xVal(S.records[0]), hi = xVal(S.records[S.records.length-1]);
    // the seek bar already reached the end we're gliding toward — stop cleanly
    if ((v>0 && c<=lo) || (v<0 && c>=hi)){ finish(); return; }
    const shiftPerPixel = (xs.max-xs.min) / canvasWidth;
    c -= v*dt*shiftPerPixel;
    scrollCenterTo(c);
    c = scrollState.c; // clamped
    momentumRAF = requestAnimationFrame(step);
  }
  momentumRAF = requestAnimationFrame(step);
}
// Coalesces rapid renderMapFrame() calls (e.g. one per pointermove during a
// seek-drag) down to at most once per animation frame, so the map keeps
// following continuously without redrawing far more often than the screen
// can actually show.
let mapRenderQueued = false;
function renderMapFrameThrottled(){
  if (mapRenderQueued) return;
  mapRenderQueued = true;
  requestAnimationFrame(()=>{ mapRenderQueued = false; renderMapFrame(); });
}
// Same idea for the timeline: pinch/pan can call clampAndSetX many times
// within a single frame, and a full renderTimeline() rebuilds every clip's
// HTML and re-attaches all its listeners — far too expensive to do more
// than once per frame, which is what was making pinch/pan feel janky.
let timelineRenderQueued = false;
function renderTimelineThrottled(){
  if (timelineRenderQueued) return;
  timelineRenderQueued = true;
  requestAnimationFrame(()=>{ timelineRenderQueued = false; renderTimeline(); });
}

async function handleFile(file){
  // Replacing an already-loaded, not-yet-saved analysis: offer to save it
  // first, since importing always starts the new file from a clean slate.
  if (S.records.length && S.dirty){
    const choice = await askChoice('区間解析情報を保存しますか?', ['はい','いいえ','キャンセル']);
    if (!choice || choice==='キャンセル') return; // abort opening the new file entirely
    if (choice==='はい'){
      await saveProjectJsonFlow($('#saveProjectAsTop'));
    }
  }
  hideHeaderMsg();
  const isZip = /\.zip$/i.test(file.name);
  const isFit = /\.fit$/i.test(file.name);
  if (!isZip && !isFit){
    showHeaderMsg('.fitまたは.zipファイルを選んでください(選択されたファイル: '+file.name+')。', true);
    return;
  }
  if (isZip){
    if (!window.JSZip){
      showHeaderMsg('ZIP展開ライブラリを読み込めませんでした。ネットワーク状態を確認してください。', true);
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      JSZip.loadAsync(reader.result).then(zip => {
        const entry = Object.values(zip.files).find(f => !f.dir && /\.fit$/i.test(f.name));
        if (!entry){
          showHeaderMsg('ZIP内にFITファイルが見つかりませんでした。', true);
          return;
        }
        // this app's own "保存" produces a .zip with the .fit alongside a
        // matching -区間分析.json — if one is present, load and apply it
        // right after the .fit, same as opening them separately would
        const jsonEntry = Object.values(zip.files).find(f => !f.dir && /\.json$/i.test(f.name));
        return entry.async('arraybuffer').then(ab => {
          processFitData(ab, file.name);
          if (jsonEntry){
            return jsonEntry.async('string').then(text => {
              try{
                const parsed = JSON.parse(text);
                const state = parsed.settings ? parsed.settings : parsed;
                const trimmed = applyState(state, 'elapsed');
                syncControlsFromState();
                buildMetricChecks();
                renderTimeline();
                renderRoutePreview();
                if (trimmed) showHeaderMsg('ZIP内のJSONの一部区間が記録範囲外のため調整されました。', true);
              }catch(err){
                showHeaderMsg('ZIP内のJSONを読み込めませんでした: '+err.message, true);
              }
            });
          }
        });
      }).catch(err => {
        showHeaderMsg('ZIPを展開できませんでした: '+err.message, true);
      });
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => processFitData(reader.result, file.name);
    reader.readAsArrayBuffer(file);
  }
}

// Raw barometric/GPS altitude is noisy enough that naively summing every
// positive step between consecutive readings substantially overcounts
// elevation gain compared to Garmin Connect/Strava, which smooth the
// altitude trace first. A simple moving average (roughly a 11-15s window
// for 1Hz data) removes most of that sensor noise while keeping genuine
// climbs and descents intact.
function smoothAltitudes(records){
  const half = 6;
  for (let i=0;i<records.length;i++){
    if (records[i].alt==null){ records[i].altSmooth = null; continue; }
    let sum=0, count=0;
    for (let j=Math.max(0,i-half); j<=Math.min(records.length-1,i+half); j++){
      if (records[j].alt!=null){ sum+=records[j].alt; count++; }
    }
    records[i].altSmooth = count ? sum/count : null;
  }
}

function processFitData(arrayBuffer, displayName){
  try{
    const records = parseFit(arrayBuffer);
    smoothAltitudes(records);
    if (!records.length) throw new Error('レコードが見つかりませんでした');
    const totalDurationSec = records[records.length-1].elapsed;
    const totalDistanceM = records[records.length-1].dist;
    const MAX_DURATION_SEC = 96*3600, MAX_DISTANCE_M = 4800*1000;
    if (totalDurationSec > MAX_DURATION_SEC || totalDistanceM > MAX_DISTANCE_M){
      showHeaderMsg('このファイルは総時間96時間または総距離4800kmの上限を超えているため解析できません。', true);
      return;
    }
    S.records = records;
    // the raw .fit bytes themselves (already unzipped, if the upload was a
    // .zip) — kept so "保存" can bundle the original recording back
    // together with the interval-analysis JSON into one .zip, without
    // needing the person to have kept the original file around separately
    S.rawFitBytes = arrayBuffer;
    S.laps = records.laps || [];
    S.hasGps = records.some(r=>r.lat!=null && r.lon!=null);
    S.fileBaseName = displayName.replace(/\.(fit|zip)$/i, '') || '区間分析';
    // a lightweight fingerprint of the untrimmed original file, captured
    // before any interval-based trimming could touch S.records — saved into
    // exported JSONs so re-opening one alongside a FIT file can check
    // they're actually the same ride (handy for a route ridden repeatedly).
    S.sourceFileInfo = {
      fileName: S.fileBaseName,
      startTime: records[0].t,
      recordCount: records.length,
      durationSec: records[records.length-1].elapsed,
      distanceM: Math.round(records[records.length-1].dist),
    };
    // importing a file always starts from a clean, default analysis state —
    // except that if the FIT file itself already has lap markers (manual or
    // auto-lap from the head unit), seed the intervals from those instead of
    // one single span covering the whole ride
    const totalEnd = records[records.length-1].elapsed;
    if (S.laps.length){
      const bounds = [0, ...S.laps.map(l=>l.elapsed).filter(e=>e>0 && e<totalEnd), totalEnd];
      const uniqueBounds = [...new Set(bounds)].sort((a,b)=>a-b);
      S.intervals = [];
      for (let i=0;i<uniqueBounds.length-1;i++){
        S.intervals.push({ id:S.nextId++, name:'', nameType:'a', start:uniqueBounds[i], end:uniqueBounds[i+1], startSet:true, endSet:true });
      }
      if (!S.intervals.length) S.intervals = [{id:S.nextId++, name:'', nameType:'a', start:0, end:totalEnd, startSet:false, endSet:false}];
    } else {
      S.intervals = [{id:S.nextId++, name:'', nameType:'a', start:0, end:totalEnd, startSet:false, endSet:false}];
    }
    S.resultColumns = COLUMN_DEFS.map(d=>({key:d.k, enabled:DEFAULT_ENABLED_COLUMNS.includes(d.k)}));
    S.metrics = ['speed','elevation']; S.xMode = 'clock'; S.ftp = null; S.weight = null; S.numberingStyle = 'circled'; S.summaryRowMode = 'last';
    S.grossIncludesStoppedTime = true; S.avgGradientMethod = 'diff';
    applyDisplayPrefs(); // carries FTP/重量/表示列 etc. over from whatever ride was analysed last
    S.powerChartMetrics = ['avgPower','elevation']; S.powerChartXMode = 'clock';
    S.powerChartSubdivisions = {}; S.powerChartSubdivideTargetIdx = null; S.powerChartSubdivideN = 2;
    powerChartDetailTarget = null;
    S.timelineSelectedId = null;
    ivHistory = []; ivRedoStack = [];
    mapChartInitialized = false;
    S.armed = null;
    S.selection = {idx: 0}; // pre-select the very start of the ride, so it's already marked on the map/chart once page 2 opens
    S.dirty = false;
    $('#fileMeta').textContent = displayName+' ・ '+fmtHMS(records[records.length-1].elapsed)+' ・ '+records.length.toLocaleString()+'ポイント';
    $('#app').classList.remove('hidden');
    $('#saveProjectAsTop').disabled = false;
    $('#importSettingsBtn').disabled = false;
    showPage(1);

    syncControlsFromState();
    buildMetricChecks();
    renderTimeline();
    renderRideSummary();
    renderRoutePreview();
    $('#resultsWrap').innerHTML = '';
    setExportEnabled(false);
    // renderTimeline() (and some of the above) call saveState(), which marks
    // S.dirty=true as a side effect — but this is the initial render of a
    // freshly-loaded, unmodified file, not a user change, so clear it again.
    S.dirty = false;
  } catch(err){
    showHeaderMsg('解析エラー: '+err.message, true);
  }
}

/* ============ PERSISTENCE (localStorage + JSON export/import) ============ */
const STORAGE_KEY = 'intervalAnalyzer.session.v1';

function serializeState(){
  // Interval 1's start is always exported as elapsed=0s, distance=0km — the
  // rest are shifted by the same amount — so a "net segment" analysis (e.g.
  // a timed attempt with the ride-to-the-start-line portion discarded) is
  // self-contained and comparable regardless of how much lead-in riding
  // preceded it in the original recording. intervalTimeOffset records the
  // elapsed-seconds amount subtracted, so re-loading this JSON against the
  // original recording can add it back and locate the intervals correctly.
  const offset = S.intervals.length ? S.intervals[0].start : 0;
  const distOffset = S.intervals.length ? nearestRecordByElapsed(S.intervals[0].start).dist : 0;
  return {
    intervals: S.intervals.map(iv=>{
      const r0 = nearestRecordByElapsed(iv.start), r1 = nearestRecordByElapsed(iv.end);
      return {
        name: iv.name,
        nameType: iv.nameType,
        startName: iv.startName,
        endName: iv.endName,
        start: iv.start-offset,
        end: iv.end-offset,
        startDistanceKm: Math.round((r0.dist-distOffset))/1000,
        endDistanceKm: Math.round((r1.dist-distOffset))/1000,
        // start/end coordinates — lets a saved analysis be carried over to a
        // different recording of the same route (e.g. daily training on the
        // same course), matching by location instead of elapsed time.
        startLat: r0.lat, startLon: r0.lon,
        endLat: r1.lat, endLon: r1.lon,
      };
    }),
    intervalTimeOffset: offset,
    sourceFile: S.sourceFileInfo,
    resultColumns: S.resultColumns,
    metrics: S.metrics,
    xMode: S.xMode,
    ftp: S.ftp,
    weight: S.weight,
    numberingStyle: S.numberingStyle,
    summaryRowMode: S.summaryRowMode,
    powerChartMetrics: S.powerChartMetrics,
    powerChartXMode: S.powerChartXMode,
  };
}
// what the last saveState() wrote — lets saveStateIfChanged() skip
// redundant writes
let lastSavedStateJson = null, lastSavedRecords = null;
function saveState(){
  if (!S.records.length) return;
  S.dirty = true;
  const json = JSON.stringify(serializeState());
  lastSavedStateJson = json; lastSavedRecords = S.records;
  try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
  saveDisplayPrefs();
}
// renderTimeline() runs every frame while panning/pinching/gliding, but
// that changes nothing that gets saved — two synchronous localStorage
// writes per frame were a real source of jank, and also flagged the ride
// as having unsaved changes just from scrolling. Only save when the
// serialized state actually differs from what was last written.
function saveStateIfChanged(){
  if (!S.records.length) return;
  if (S.records===lastSavedRecords && JSON.stringify(serializeState())===lastSavedStateJson) return;
  saveState();
}
function loadSavedState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
// "結果の表示項目" (FTP, 重量, 全区間行の有無, 停止時間の扱い, 平均斜度の算出方法,
// 表示する結果列) persist across different .fit files, separately from the
// per-ride session above — so they carry over the next time a new ride is
// opened rather than resetting to the defaults each time.
const DISPLAY_PREFS_KEY = 'quaniter.displayPrefs.v1';
function saveDisplayPrefs(){
  try{
    localStorage.setItem(DISPLAY_PREFS_KEY, JSON.stringify({
      resultColumns: S.resultColumns, ftp: S.ftp, weight: S.weight,
      summaryRowMode: S.summaryRowMode, grossIncludesStoppedTime: S.grossIncludesStoppedTime,
      avgGradientMethod: S.avgGradientMethod,
    }));
  }catch(e){}
}
function loadDisplayPrefs(){
  try{
    const raw = localStorage.getItem(DISPLAY_PREFS_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function applyDisplayPrefs(){
  const p = loadDisplayPrefs();
  if (!p) return;
  if (Array.isArray(p.resultColumns)) S.resultColumns = p.resultColumns;
  if (p.ftp!=null) S.ftp = p.ftp;

  if (p.summaryRowMode) S.summaryRowMode = p.summaryRowMode;

  if (p.avgGradientMethod) S.avgGradientMethod = p.avgGradientMethod;
}
// Finds the record in `records` geographically closest to (lat, lon).
// Used to carry a saved analysis over to a different recording of the same
// route, matching each interval's start/end by location instead of by
// elapsed time (which wouldn't line up between two separate rides).
function nearestRecordByLatLon(records, lat, lon){
  let best=null, bestD=Infinity;
  for (const r of records){
    if (r.lat==null || r.lon==null) continue;
    const d = haversine(lat, lon, r.lat, r.lon);
    if (d<bestD){ bestD=d; best=r; }
  }
  return best ? {record:best, distanceM:bestD} : null;
}

function applyState(state, mode){
  if (!state || !S.records.length) return false;
  const lo = S.records[0].elapsed, hi = S.records[S.records.length-1].elapsed;
  // a saved JSON may have had its interval times shifted so the first
  // interval starts at 0 (done for "net segment" analyses, so distinct
  // rides' actual attempt segments line up when compared) — add that back
  // so the intervals correctly locate within this recording's own timeline.
  const offset = Number(state.intervalTimeOffset) || 0;
  let trimmed = false;
  if (Array.isArray(state.intervals) && state.intervals.length){
    S.intervals = state.intervals.map(iv=>{
      const start = Math.max(lo, Math.min(hi, (Number(iv.start)||0)+offset));
      let end = Math.max(lo, Math.min(hi, (Number(iv.end)||hi)+offset));
      if (end<=start) end = Math.min(hi, start+1);
      return { id:S.nextId++, name: iv.name || '区間', nameType: iv.nameType||'a', startName: iv.startName, endName: iv.endName, start, end, startSet:true, endSet:true };
    });
    // Records are never discarded here any more — the whole original
    // recording stays loaded regardless of where the intervals happen to
    // sit within it. If interval 1 doesn't start at the true beginning of
    // the log, page 3's table/chart instead re-bases their own displayed
    // elapsed time and distance to read from 0 at interval 1's own start
    // (see computeAndRenderResults and renderPowerChart) — the underlying
    // record data itself is untouched, so nothing is lost.
  }
  if (Array.isArray(state.resultColumns) && state.resultColumns.length){
    const savedMap = Object.fromEntries(state.resultColumns.map(c=>[c.key, c.enabled]));
    const orderedKeys = state.resultColumns.map(c=>c.key).filter(k=>COL_META[k]);
    // insert any column that's new since this state was saved right after the
    // nearest earlier column (in the master COLUMN_DEFS order) that's already
    // present, rather than dumping all new columns at the very end.
    COLUMN_DEFS.forEach((d,i)=>{
      if (orderedKeys.includes(d.k)) return;
      let insertAt = orderedKeys.length;
      for (let j=i-1; j>=0; j--){
        const idx = orderedKeys.indexOf(COLUMN_DEFS[j].k);
        if (idx !== -1){ insertAt = idx+1; break; }
      }
      orderedKeys.splice(insertAt, 0, d.k);
    });
    S.resultColumns = orderedKeys.map(k=>({key:k, enabled: savedMap[k]!=null? !!savedMap[k] : DEFAULT_ENABLED_COLUMNS.includes(k)}));
    // one-off correction: earlier saves could have appended netTimeCum at the
    // very end instead of right after netTime; realign it if that happened.
    const ntIdx = S.resultColumns.findIndex(c=>c.key==='netTime');
    const ntcIdx = S.resultColumns.findIndex(c=>c.key==='netTimeCum');
    if (ntIdx!==-1 && ntcIdx!==-1 && ntcIdx!==ntIdx+1){
      const [item] = S.resultColumns.splice(ntcIdx,1);
      const newNtIdx = S.resultColumns.findIndex(c=>c.key==='netTime');
      S.resultColumns.splice(newNtIdx+1, 0, item);
    }
  }
  if (Array.isArray(state.metrics) && state.metrics.length){
    S.metrics = state.metrics.filter(m=>METRIC_META[m]);
    if (!S.metrics.length) S.metrics = ['speed'];
  }
  if (state.xMode && ['elapsed','clock','dist'].includes(state.xMode)) S.xMode = state.xMode;
  if (['off','arabic','circled','kanji'].includes(state.numberingStyle)) S.numberingStyle = state.numberingStyle;
  if (['off','first','last'].includes(state.summaryRowMode)) S.summaryRowMode = state.summaryRowMode;
  if (state.ftp!=null && !isNaN(state.ftp) && state.ftp>0) S.ftp = Number(state.ftp);
  if (state.weight!=null && !isNaN(state.weight) && state.weight>0) S.weight = Number(state.weight);
  if (Array.isArray(state.powerChartMetrics) && state.powerChartMetrics.length){
    const pm = state.powerChartMetrics.filter(k=>POWER_CHART_METRICS[k]).slice(0,4);
    if (pm.length) S.powerChartMetrics = pm;
  }
  if (state.powerChartXMode && ['clock','elapsed','dist'].includes(state.powerChartXMode)) S.powerChartXMode = state.powerChartXMode;
  return trimmed;
}

function buildProjectJson(){
  let n = 0;
  const results = lastResults ? {
    columns: lastResults.cols,
    intervals: lastResults.rows.map(r=>{
      const label = r.isSummary ? r.name : (numberPrefix(++n)+intervalDisplayName(r, n-1));
      const obj = { name: label };
      if (r.isSummary) obj.isSummary = true;
      lastResults.cols.forEach(c=>{
        const v = r[c];
        obj[c] = (v!=null && typeof v==='number') ? Math.round(v*100)/100 : v;
      });
      return obj;
    })
  } : null;
  return JSON.stringify({ generatedAt: new Date().toISOString(), fitFile: S.fileBaseName, settings: serializeState(), results }, null, 2);
}
// Just save — if a file with the same name already exists, the browser's
// own download handling numbers the duplicate itself (or, in Chrome/Edge
// via the File System Access API, its native picker asks to replace it).
// Saves the original .fit recording bundled together with this analysis's
// JSON into one .zip (named after the originally-loaded .fit/.zip file),
// rather than the JSON alone — so re-opening later never depends on also
// having kept the original recording around separately.
async function saveProjectJsonFlow(btn){
  if (!S.records.length || !S.rawFitBytes) return;
  if (!window.JSZip){
    showHeaderMsg('ZIP作成ライブラリを読み込めませんでした。ネットワーク状態を確認してください。', true);
    return;
  }
  const zip = new JSZip();
  zip.file(S.fileBaseName+'.fit', S.rawFitBytes);
  zip.file(S.fileBaseName+'-区間分析.json', buildProjectJson());
  const blob = await zip.generateAsync({type:'blob'});
  const ok = await saveAs('project', S.fileBaseName+'.zip', blob, 'application/zip', 'zip', 'ZIP', btn);
  if (ok) S.dirty = false;
}
