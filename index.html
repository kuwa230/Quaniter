/* ============ MAP (slippy tile map, OSM raster tiles) ============ */
const routeWrap = $('#routeWrap');
const mapBadge = $('#mapBadge');
const TILE_SIZE = 256;
let tileErrorShown = false;

function lonLatToWorld(lon, lat, zoom){
  const scale = TILE_SIZE * Math.pow(2, zoom);
  const x = (lon+180)/360*scale;
  const sinLat = Math.max(-0.9999, Math.min(0.9999, Math.sin(lat*Math.PI/180)));
  const y = (0.5 - Math.log((1+sinLat)/(1-sinLat))/(4*Math.PI)) * scale;
  return [x,y];
}
function worldToLonLat(x, y, zoom){
  const scale = TILE_SIZE * Math.pow(2, zoom);
  const lon = x/scale*360 - 180;
  const n = Math.PI - 2*Math.PI*y/scale;
  const lat = 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
  return [lon, lat];
}
function fitZoomLevel(minLat,maxLat,minLon,maxLon, vw, vh){
  const pad = 50;
  for (let z=18; z>=2; z--){
    const p1 = lonLatToWorld(minLon, maxLat, z);
    const p2 = lonLatToWorld(maxLon, minLat, z);
    if (Math.abs(p2[0]-p1[0]) <= vw-pad*2 && Math.abs(p2[1]-p1[1]) <= vh-pad*2) return z;
  }
  return 2;
}

function renderRoute(){
  if (!S.hasGps){
    routeWrap.classList.add('empty');
    routeWrap.innerHTML = '<span>この記録には位置情報(GPS)がありません</span>';
    return;
  }
  routeWrap.classList.remove('empty');
  tileErrorShown = false;
  tileElements = new Map(); // the tileLayer div below is rebuilt fresh, so any cached elements from before are gone
  window.__mapTileError = function(){
    if (tileErrorShown) return;
    tileErrorShown = true;
    showHeaderMsg('地図タイルを読み込めませんでした(ネットワーク制限、またはOSMサーバー側の一時的なブロックの可能性があります)', true);
  };
  window.__mapTileSuccess = function(){
    if (!tileErrorShown) return;
    tileErrorShown = false;
    hideHeaderMsg();
  };
  const pts = S.records.filter(r=>r.lat!=null && r.lon!=null);
  const lats = pts.map(p=>p.lat), lons = pts.map(p=>p.lon);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLon=Math.min(...lons), maxLon=Math.max(...lons);
  const midLat=(minLat+maxLat)/2, midLon=(minLon+maxLon)/2;

  routeWrap.innerHTML =
    '<div id="mapViewport" style="position:absolute;inset:0;overflow:hidden;cursor:grab;">'+
      '<div id="tileLayer" style="position:absolute;top:0;left:0;width:0;height:0;transition:transform .18s ease-out;"></div>'+
      '<svg id="routeSvg" style="position:absolute;top:0;left:0;pointer-events:none;transition:transform .18s ease-out;"></svg>'+
    '</div>'+
    '<div style="position:absolute;top:6px;right:6px;font-size:10px;background:rgba(255,255,255,.82);color:#222;padding:1px 6px;border-radius:5px;">© OpenStreetMap contributors</div>'+
    '<div id="mapScale" style="position:absolute;bottom:8px;left:6px;pointer-events:none;">'+
      '<div id="mapScaleBar" style="height:4px;border:1.5px solid #222;border-top:none;background:rgba(255,255,255,.55);"></div>'+
      '<div id="mapScaleLabel" style="font-size:10.5px;color:#222;background:rgba(255,255,255,.82);display:inline-block;padding:0 4px;border-radius:3px;margin-top:2px;"></div>'+
    '</div>'+
    '<div style="position:absolute;bottom:8px;right:6px;display:flex;flex-direction:column;gap:5px;">'+
      '<button id="mapGoogleSearch" class="small mapCtrlBtn" type="button" title="Google マップで検索">📍</button>'+
    '</div>';

  const rect = routeWrap.getBoundingClientRect();
  // If a selection is already set (e.g. right after a fresh FIT import,
  // which pre-selects the very start of the ride), open the map centred on
  // that point at a 500m scale-bar reading, rather than the whole-route
  // overview — the person can always zoom back out from there.
  let zoom, cx, cy;
  const selRec = S.selection ? S.records[S.selection.idx] : null;
  if (selRec && selRec.lat!=null && selRec.lon!=null){
    zoom = zoomForScaleMeters(500, selRec.lat, rect.width);
    [cx, cy] = lonLatToWorld(selRec.lon, selRec.lat, zoom);
  } else {
    zoom = fitZoomLevel(minLat, maxLat, minLon, maxLon, rect.width, rect.height);
    [cx, cy] = lonLatToWorld(midLon, midLat, zoom);
  }
  S.mapView = {cx, cy, zoom, minZoom: Math.max(2, zoom-3), maxZoom: 18};

  const stride = Math.max(1, Math.floor(S.records.length/3000));
  const routeLonLat = [];
  S.records.forEach((r,idx)=>{
    if (r.lat==null || r.lon==null) return;
    if (idx % stride !== 0 && idx !== S.records.length-1) return;
    routeLonLat.push({lon:r.lon, lat:r.lat, idx});
  });
  S.routeLonLat = routeLonLat;
  S.routeStartEnd = {
    start: {lon: S.records.find(r=>r.lat!=null).lon, lat: S.records.find(r=>r.lat!=null).lat},
    end: (()=>{ const r=[...S.records].reverse().find(r=>r.lat!=null); return {lon:r.lon, lat:r.lat}; })()
  };
  S.routeWorldZoom = null;
  renderMapFrame();
  attachMapInteraction();
}

function computeRouteWorldPts(zoom){
  S.routeWorldPts = S.routeLonLat.map(p=>{
    const [wx,wy] = lonLatToWorld(p.lon, p.lat, zoom);
    return {wx,wy,idx:p.idx};
  });
  S.routeWorldZoom = zoom;
}

const SCALE_NICE_METERS = [1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000,200000,500000,1000000,2000000];
// Inverse of the scale-bar logic below: what zoom level makes the scale
// bar's own "nice" chosen value read as targetMeters, at this latitude and
// viewport width (aiming comfortably inside the range that would choose
// targetMeters rather than the next value up or down).
function zoomForScaleMeters(targetMeters, lat, vw){
  // Guard against vw being 0 (the map container's flex-computed size not
  // having settled yet the very first time this runs) — dividing by a
  // near-zero maxWidthPx would send zoom to -Infinity, which then silently
  // broke every tile coordinate computed from it, including on later pans/
  // zooms, since S.mapView.zoom itself started out invalid.
  const maxWidthPx = Math.max(40, Math.min(110, vw*0.35));
  const targetMaxMeters = targetMeters * 1.2; // safely inside [targetMeters, 2*targetMeters)
  const metersPerPixel = targetMaxMeters / maxWidthPx;
  const z = Math.log2(156543.03392 * Math.cos(lat*Math.PI/180) / metersPerPixel);
  // OSM tile URLs need an *integer* zoom (fractional zoom isn't a thing this
  // app's tile-fetching supports) — a fractional value here silently made
  // every tile request 404, which is why nothing loaded even after the
  // earlier -Infinity fix.
  return Number.isFinite(z) ? Math.round(z) : 15;
}
function updateScaleBar(zoom, centerLat, vw){
  const bar = $('#mapScaleBar'), label = $('#mapScaleLabel');
  if (!bar || !label) return;
  const maxWidthPx = Math.min(110, vw*0.35);
  const metersPerPixel = 156543.03392 * Math.cos(centerLat*Math.PI/180) / Math.pow(2, zoom);
  const maxMeters = maxWidthPx * metersPerPixel;
  let chosen = SCALE_NICE_METERS[0];
  for (const v of SCALE_NICE_METERS){ if (v <= maxMeters) chosen = v; else break; }
  const widthPx = chosen / metersPerPixel;
  bar.style.width = widthPx.toFixed(1)+'px';
  label.textContent = chosen>=1000 ? (chosen/1000)+' km' : chosen+' m';
}

// Persistent map of "z_x_y" -> <img> element, reused across renderMapFrame
// calls during a pan/zoom gesture. Previously every frame rebuilt the whole
// tile layer's innerHTML from scratch, discarding and recreating an <img>
// for every visible tile — including ones that hadn't actually moved —
// which meant a brief blank flash for tiles that were already loaded and
// on screen a moment earlier. Reusing the same element for a tile that's
// still visible (just repositioning it) keeps it painted continuously.
let tileElements = new Map();

function renderMapFrame(){
  const tileLayer = $('#tileLayer');
  const svg = $('#routeSvg');
  if (!tileLayer || !svg) return;
  tileLayer.style.transform=''; svg.style.transform='';
  const rect = routeWrap.getBoundingClientRect();
  const vw = rect.width, vh = rect.height;
  const {cx, cy, zoom} = S.mapView;
  const topLeftX = cx - vw/2, topLeftY = cy - vh/2;
  const n = Math.pow(2, zoom);

  const txMin = Math.floor(topLeftX/TILE_SIZE), txMax = Math.floor((topLeftX+vw)/TILE_SIZE);
  const tyMin = Math.max(0, Math.floor(topLeftY/TILE_SIZE)), tyMax = Math.min(n-1, Math.floor((topLeftY+vh)/TILE_SIZE));
  const neededKeys = new Set();
  for (let tx=txMin; tx<=txMax; tx++){
    const wrappedX = ((tx % n)+n) % n;
    for (let ty=tyMin; ty<=tyMax; ty++){
      const key = zoom+'_'+wrappedX+'_'+ty;
      neededKeys.add(key);
      const left = tx*TILE_SIZE - topLeftX, top = ty*TILE_SIZE - topLeftY;
      let img = tileElements.get(key);
      if (!img){
        img = document.createElement('img');
        img.src = 'https://tile.openstreetmap.org/'+zoom+'/'+wrappedX+'/'+ty+'.png';
        img.draggable = false;
        img.loading = 'lazy';
        img.alt = '';
        img.style.position = 'absolute';
        img.style.width = TILE_SIZE+'px'; img.style.height = TILE_SIZE+'px';
        img.style.pointerEvents = 'none';
        img.onerror = ()=>{ window.__mapTileError && window.__mapTileError(); };
        img.onload = ()=>{ window.__mapTileSuccess && window.__mapTileSuccess(); };
        tileLayer.appendChild(img);
        tileElements.set(key, img);
      }
      img.style.left = left+'px';
      img.style.top = top+'px';
    }
  }
  // drop tiles that scrolled out of view, so the cache doesn't grow forever
  for (const [key, img] of tileElements){
    if (!neededKeys.has(key)){ img.remove(); tileElements.delete(key); }
  }

  if (S.routeWorldZoom !== zoom) computeRouteWorldPts(zoom);
  svg.setAttribute('width', vw); svg.setAttribute('height', vh);
  svg.setAttribute('viewBox', '0 0 '+vw+' '+vh);
  let d = '';
  S.routeWorldPts.forEach(p=>{
    const x=(p.wx-topLeftX).toFixed(1), y=(p.wy-topLeftY).toFixed(1);
    d += (d?' L ':'M ') + x+' '+y;
  });
  const [sx0,sy0] = lonLatToWorld(S.routeStartEnd.start.lon, S.routeStartEnd.start.lat, zoom);
  const [sx1,sy1] = lonLatToWorld(S.routeStartEnd.end.lon, S.routeStartEnd.end.lat, zoom);
  let cursorHtml = '';
  if (S.selection){
    const r = S.records[S.selection.idx];
    if (r.lat!=null && r.lon!=null){
      const [wx,wy] = lonLatToWorld(r.lon, r.lat, zoom);
      cursorHtml = '<circle cx="'+(wx-topLeftX)+'" cy="'+(wy-topLeftY)+'" r="7" fill="#fff" stroke="'+cssVar('--power')+'" stroke-width="3"/>';
    }
  }
  // number markers at each interval's start point, matching the numbered
  // badges shown on the interval cards in the sidebar
  let ivMarkersHtml = '';
  S.intervals.forEach((iv,i)=>{
    let r = nearestRecordByElapsed(iv.start);
    let approximate = false;
    if (!r) return;
    if (r.lat==null || r.lon==null){
      const fallback = nearestGpsRecordTo(r);
      if (!fallback) return;
      r = fallback; approximate = true;
    }
    const [wx,wy] = lonLatToWorld(r.lon, r.lat, zoom);
    const x=(wx-topLeftX), y=(wy-topLeftY);
    ivMarkersHtml += '<g'+(approximate?' opacity="0.5"':'')+'>'+
      '<circle cx="'+x+'" cy="'+y+'" r="9" fill="'+cssVar('--accent')+'" stroke="#fff" stroke-width="1.5"/>'+
      '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#08211d">'+(i+1)+'</text>'+
      '</g>';
  });
  svg.innerHTML =
    '<path d="'+d+'" fill="none" stroke="'+cssVar('--speed')+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>'+
    '<circle cx="'+(sx0-topLeftX)+'" cy="'+(sy0-topLeftY)+'" r="6" fill="#3fbf6a" stroke="#fff" stroke-width="1.5"/>'+
    '<circle cx="'+(sx1-topLeftX)+'" cy="'+(sy1-topLeftY)+'" r="6" fill="'+cssVar('--hr')+'" stroke="#fff" stroke-width="1.5"/>'+
    ivMarkersHtml+
    cursorHtml;

  const [, centerLat] = worldToLonLat(cx, cy, zoom);
  updateScaleBar(zoom, centerLat, vw);
}

let mapFrameQueued = false;
function scheduleMapFrame(){
  if (mapFrameQueued) return;
  mapFrameQueued = true;
  requestAnimationFrame(()=>{ mapFrameQueued=false; renderMapFrame(); });
}

function computeZoomedCenter(anchorX, anchorY, fromCx, fromCy, fromZoom, toZoom, vw, vh){
  const topLeftX = fromCx - vw/2, topLeftY = fromCy - vh/2;
  const worldX = topLeftX+anchorX, worldY = topLeftY+anchorY;
  const ratio = Math.pow(2, toZoom-fromZoom);
  return [worldX*ratio - anchorX + vw/2, worldY*ratio - anchorY + vh/2];
}

function zoomMapAt(screenX, screenY, dz){
  const rect = routeWrap.getBoundingClientRect();
  const vw = rect.width, vh = rect.height;
  const v = S.mapView;
  const newZoom = Math.max(v.minZoom, Math.min(v.maxZoom, v.zoom + dz));
  if (newZoom === v.zoom) return;
  const [ncx, ncy] = computeZoomedCenter(screenX, screenY, v.cx, v.cy, v.zoom, newZoom, vw, vh);
  v.cx = ncx; v.cy = ncy; v.zoom = newZoom;
  scheduleMapFrame();
}

function attachMapInteraction(){
  const vp = $('#mapViewport');
  const tileLayer = $('#tileLayer'), svg = $('#routeSvg');
  if (!vp) return;
  // damping: a full doubling of pinch finger-distance moves the zoom by
  // PINCH_SENSITIVITY levels rather than a full level — lower this to make
  // pinch feel less twitchy, raise it to make pinch more responsive.
  const PINCH_SENSITIVITY = 1.0;
  let dragging=false, lastX=0, lastY=0, moved=false;
  // pinch state: gesture anchored at start, live visual scale only, snapped to a
  // discrete zoom level on release — this keeps small finger movements from
  // causing large jumps, since the map only re-renders once per gesture.
  let pinch = null;
  // Track how many pointers (fingers) are currently down, so a second finger
  // touching down mid-drag hands control over to the two-finger pinch
  // handler below instead of also panning via this single-pointer drag.
  const activePointers = new Set();

  // 2D momentum for map panning — mirrors the chart/timeline's "recent
  // window" velocity approach (last ~80ms before release, not a long-memory
  // average), since this app never had any map momentum at all before.
  let mapMoveHistory = [], mapMomentumRAF = null;
  function pushMapSample(x,y,t){
    mapMoveHistory.push({x,y,t});
    const cutoff = t-80;
    while (mapMoveHistory.length>2 && mapMoveHistory[0].t<cutoff) mapMoveHistory.shift();
  }
  function mapRecentVelocity(){
    if (mapMoveHistory.length<2) return {vx:0, vy:0};
    const a=mapMoveHistory[0], b=mapMoveHistory[mapMoveHistory.length-1];
    const dt=b.t-a.t;
    return dt>0 ? {vx:(b.x-a.x)/dt, vy:(b.y-a.y)/dt} : {vx:0, vy:0};
  }
  function stopMapMomentum(){ if (mapMomentumRAF!=null){ cancelAnimationFrame(mapMomentumRAF); mapMomentumRAF=null; } }
  function startMapMomentum(vx0, vy0){
    // same iOS UIScrollView-derived physics as startMomentum() (2D version)
    let vx=vx0, vy=vy0, lastT=performance.now();
    function step(t){
      const dt = Math.min(48, t-lastT); lastT=t;
      vx *= Math.pow(MOMENTUM_DECELERATION, dt); vy *= Math.pow(MOMENTUM_DECELERATION, dt);
      if (Math.abs(vx)<MOMENTUM_STOP_THRESHOLD && Math.abs(vy)<MOMENTUM_STOP_THRESHOLD){ mapMomentumRAF=null; return; }
      S.mapView.cx -= vx*dt; S.mapView.cy -= vy*dt;
      scheduleMapFrame();
      mapMomentumRAF = requestAnimationFrame(step);
    }
    mapMomentumRAF = requestAnimationFrame(step);
  }
  vp.addEventListener('pointerdown', e=>{
    activePointers.add(e.pointerId);
    if (activePointers.size > 1){ dragging=false; return; }
    stopMapMomentum();
    dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY;
    mapMoveHistory = [{x:e.clientX, y:e.clientY, t:performance.now()}];
    vp.style.cursor='grabbing';
    vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', e=>{
    if (!dragging || activePointers.size>1) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if (Math.abs(dx)+Math.abs(dy) > 3) moved=true;
    S.mapView.cx -= dx; S.mapView.cy -= dy;
    lastX=e.clientX; lastY=e.clientY;
    pushMapSample(e.clientX, e.clientY, performance.now());
    scheduleMapFrame();
  });
  vp.addEventListener('pointerup', e=>{
    activePointers.delete(e.pointerId);
    const wasDragging = dragging;
    dragging=false; vp.style.cursor='grab';
    if (wasDragging && !moved && activePointers.size===0) selectFromMap(e.clientX, e.clientY);
    else if (wasDragging && moved){
      const {vx,vy} = mapRecentVelocity();
      if (Math.abs(vx)>0.02 || Math.abs(vy)>0.02) startMapMomentum(vx, vy);
    }
  });
  vp.addEventListener('pointercancel', e=>{ activePointers.delete(e.pointerId); dragging=false; });
  // wheel: covers both a real mouse wheel AND a trackpad pinch gesture (the
  // browser reports trackpad pinch as wheel events, never as touch events,
  // on non-touchscreen laptops) — so it gets the same damping + smoothing
  // + snap-on-pause treatment as touch pinch below.
  const WHEEL_SENSITIVITY = 0.012;
  const WHEEL_NOISE_FLOOR = 2.2; // ignore tiny trailing deltaY from trackpad momentum/inertia
  let wheelGesture = null, wheelTimer = null;
  vp.addEventListener('wheel', e=>{
    e.preventDefault();
    if (Math.abs(e.deltaY) < WHEEL_NOISE_FLOOR) return;
    const rect = vp.getBoundingClientRect();
    const x = e.clientX-rect.left, y = e.clientY-rect.top;
    if (!wheelGesture){
      wheelGesture = { anchorX:x, anchorY:y, startZoom:S.mapView.zoom, startCx:S.mapView.cx, startCy:S.mapView.cy, accum:0 };
    }
    wheelGesture.accum += -e.deltaY;
    const zoomDelta = wheelGesture.accum * WHEEL_SENSITIVITY;
    const visualScale = Math.pow(2, zoomDelta);
    const t = 'scale('+visualScale+')';
    const origin = wheelGesture.anchorX+'px '+wheelGesture.anchorY+'px';
    if (tileLayer){ tileLayer.style.transformOrigin = origin; tileLayer.style.transform = t; }
    if (svg){ svg.style.transformOrigin = origin; svg.style.transform = t; }
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(()=>{
      const v = S.mapView;
      const rawZoom = wheelGesture.startZoom + wheelGesture.accum * WHEEL_SENSITIVITY;
      const newZoom = Math.max(v.minZoom, Math.min(v.maxZoom, Math.round(rawZoom)));
      const [ncx, ncy] = computeZoomedCenter(wheelGesture.anchorX, wheelGesture.anchorY, wheelGesture.startCx, wheelGesture.startCy, wheelGesture.startZoom, newZoom, rect.width, rect.height);
      v.cx = ncx; v.cy = ncy; v.zoom = newZoom;
      wheelGesture = null;
      renderMapFrame();
    }, 160);
  }, {passive:false});

  vp.addEventListener('touchstart', e=>{
    if (e.touches.length===2){
      const rect = vp.getBoundingClientRect();
      pinch = {
        startDist: touchDist(e.touches),
        midX: (e.touches[0].clientX+e.touches[1].clientX)/2-rect.left,
        midY: (e.touches[0].clientY+e.touches[1].clientY)/2-rect.top,
        startZoom: S.mapView.zoom, startCx: S.mapView.cx, startCy: S.mapView.cy,
        ratio: 1
      };
    }
  }, {passive:true});
  vp.addEventListener('touchmove', e=>{
    if (e.touches.length===2 && pinch){
      e.preventDefault();
      const nd = touchDist(e.touches);
      pinch.ratio = nd/pinch.startDist;
      const zoomDelta = Math.log2(pinch.ratio) * PINCH_SENSITIVITY;
      const visualScale = Math.pow(2, zoomDelta);
      const t = 'scale('+visualScale+')';
      const origin = pinch.midX+'px '+pinch.midY+'px';
      if (tileLayer){ tileLayer.style.transformOrigin = origin; tileLayer.style.transform = t; }
      if (svg){ svg.style.transformOrigin = origin; svg.style.transform = t; }
    }
  }, {passive:false});
  vp.addEventListener('touchend', e=>{
    if (pinch && e.touches.length<2){
      const rect = vp.getBoundingClientRect();
      const v = S.mapView;
      const rawZoom = pinch.startZoom + Math.log2(pinch.ratio) * PINCH_SENSITIVITY;
      const newZoom = Math.max(v.minZoom, Math.min(v.maxZoom, Math.round(rawZoom)));
      const [ncx, ncy] = computeZoomedCenter(pinch.midX, pinch.midY, pinch.startCx, pinch.startCy, pinch.startZoom, newZoom, rect.width, rect.height);
      v.cx = ncx; v.cy = ncy; v.zoom = newZoom;
      pinch = null;
      renderMapFrame();
    }
  });

  function touchDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }

  $('#mapGoogleSearch').addEventListener('click', (e)=>{
    const btn = e.currentTarget;
    if (!S.selection){ flashBtn(btn, '先に地点を選択'); return; }
    const rec = S.records[S.selection.idx];
    if (rec.lat==null || rec.lon==null){ flashBtn(btn, '位置情報なし'); return; }
    const url = 'https://www.google.com/maps/search/?api=1&query='+rec.lat.toFixed(6)+','+rec.lon.toFixed(6);
    window.open(url, '_blank');
  });
}
function flashBtn(btn, msg){
  if (!msg) return;
  showHeaderMsg(msg, false);
}


function selectFromMap(clientX, clientY){
  const rect = routeWrap.getBoundingClientRect();
  const vw = rect.width, vh = rect.height;
  const v = S.mapView;
  const topLeftX = v.cx - vw/2, topLeftY = v.cy - vh/2;
  const worldX = topLeftX + (clientX-rect.left), worldY = topLeftY + (clientY-rect.top);
  let nearest=null, nearestD=Infinity;
  for (const p of S.routeWorldPts){
    const dd = (p.wx-worldX)**2 + (p.wy-worldY)**2;
    if (dd<nearestD){ nearestD=dd; nearest=p; }
  }
  if (nearest) setSelection(nearest.idx, {clientX, clientY}, 'map');
}

/* ============ CHART ============ */
function downsampleForChart(records, target){
  if (records.length<=target) return records;
  const stride = Math.ceil(records.length/target);
  const out = [];
  for (let i=0;i<records.length;i+=stride) out.push(records[i]);
  if (out[out.length-1]!==records[records.length-1]) out.push(records[records.length-1]);
  return out;
}

function xVal(r){ return S.xMode==='dist' ? r.dist : r.elapsed; }

function xTickLabel(v){
  if (S.xMode==='elapsed') return fmtHMS(v);
  if (S.xMode==='clock') return fmtClock(S.records[0].t+v);
  return fmtKm(v)+' km'; // dist mode: v is already meters (the x-value itself)
}

// Finds the record with GPS closest in time (elapsed) to the given record —
// used when a specific point (an interval boundary, say) has no GPS fix of
// its own and something needs a real position to fall back to.
function nearestGpsRecordTo(rec){
  let best=null, bestDist=Infinity;
  for (const r2 of S.records){
    if (r2.lat==null || r2.lon==null) continue;
    const d = Math.abs(r2.elapsed - rec.elapsed);
    if (d<bestDist){ bestDist=d; best=r2; }
  }
  return best;
}

function nearestRecordByElapsed(elapsed){
  return nearestRecordByElapsedIn(S.records, elapsed);
}
function nearestRecordByElapsedIn(recs, elapsed){
  let lo=0, hi=recs.length-1;
  while (lo<hi){ const mid=(lo+hi)>>1; if (recs[mid].elapsed<elapsed) lo=mid+1; else hi=mid; }
  return recs[lo];
}
function nearestRecordByDist(dist){
  const recs = S.records;
  let lo=0, hi=recs.length-1;
  while (lo<hi){ const mid=(lo+hi)>>1; if (recs[mid].dist<dist) lo=mid+1; else hi=mid; }
  return recs[lo];
}

// like nearestRecordByElapsed, but honours the chart's current x-axis mode
// (elapsed time, clock time, or distance) — used only for chart interactions,
// since interval boundaries are always stored/looked-up by elapsed time.
function nearestRecordByX(target){
  return S.records[nearestIndexByX(target)];
}
function nearestIndexByX(target){
  const recs = S.records;
  let lo=0, hi=recs.length-1;
  while (lo<hi){ const mid=(lo+hi)>>1; if (xVal(recs[mid])<target) lo=mid+1; else hi=mid; }
  return lo;
}

// draws a dashed vertical line at the currently selected record's x position
// (kept in sync with whatever taps the map or the chart itself point to)
let chartIsPanning = false; // hides the selection marker while true (see below)

// ============ CUSTOM CHART RENDERER (replaces Chart.js for page 2) ============
// Chart.js's internal scale/layout system proved unreliable for this app's
// unusual requirements (zero-width axes, exact pixel alignment with the
// timeline, custom horizontal titles) — several rounds of fighting its
// undocumented internals (afterFit, display:false, forcing chartArea after
// layout) each partially worked and partially broke something else. This
// hand-drawn renderer gives full, predictable control: S.chartView={min,max}
// is the single source of truth for the visible x-range (in xVal() units),
// and every pixel is placed by a mapping function written and owned here,
// not inferred from a third-party library's internal state.
function chartMetricRange(m){
  const meta = METRIC_META[m];
  let mn=Infinity, mx=-Infinity;
  S.records.forEach(r=>{ const v=meta.get(r); if (v!=null){ if(v<mn)mn=v; if(v>mx)mx=v; } });
  if (!isFinite(mn)){ mn=0; mx=1; }
  if (m==='elevation') mn = Math.min(mn, -10);
  if (mn===mx){ mn-=1; mx+=1; }
  return {min:mn, max:mx};
}
function chartCanvasSetup(canvas){
  // Measure the PARENT container (#chartWrap), not the canvas element
  // itself. This was the actual, persistent cause of the right-edge gap
  // that survived every earlier attempt: #chartWrap is a plain block
  // container (not flex), and nothing in the CSS forces the <canvas> to
  // 100% width — its on-screen size is controlled entirely by this
  // function via style.width. Measuring canvas.getBoundingClientRect()
  // was self-referential: once style.width got set once (to whatever was
  // measured, including the browser's tiny ~300px default on the very
  // first call before any width had ever been assigned), every later call
  // measured that SAME already-set width right back again — the canvas
  // could never grow to match its container no matter how many times or
  // how much later it was re-measured, which is exactly why a fixed
  // right-side gap persisted at every scroll position rather than only
  // appearing once or correcting itself. Measuring the parent breaks the
  // loop, since #chartWrap's own size is governed by flexbox (#p2ChartTimeline),
  // never by anything this function writes.

// does, and doing it synchronously every frame was very likely dropping
// frames during fast flicks (video analysis showed bursty jumps separated

// render call taking longer than one frame's budget). Deferring the DOM
// update to its own rAF decouples it from the synchronous canvas redraw

  for (const st of steps){ if (st/span*widthPx >= TICK_MIN_PX){ step = st; break; } }

    const v = base + k*step;

    const lab = document.createElement('span'); lab.className = 'xTickLabel';
    el.appendChild(line); el.appendChild(lab);
    pool.push({line, lab, text:null});

  pool.forEach((p,i)=>{
    if (i>=ticks.length){ if (p.shown){ p.line.style.display = p.lab.style.display = 'none'; p.shown=false; } return; }

function redrawChart(){
  const canvas = $('#chart');
  if (!canvas || !S.chartView || !S.records.length) return;
  const {ctx, w, h} = chartCanvasSetup(canvas);
  ctx.clearRect(0,0,w,h);
  const padTop = 16, padBottom = 0; // no bottom gap: the gridlines run on unbroken into the label strip and timeline
  const plotTop = padTop, plotBottom = Math.max(padTop+10, h-padBottom);
  const plotLeft = 0, plotRight = w; // spans the canvas's full width — exactly matches the timeline below
  const view = S.chartView;
  const span = Math.max(1e-6, view.max-view.min);
  const xPx = v => plotLeft + (v-view.min)/span*(plotRight-plotLeft);
  S.chartPlotTop = plotTop; S.chartPlotBottom = plotBottom;

  // vertical gridlines at round x values — they scroll with the data
  const xTicks = computeXTicks(view, plotRight-plotLeft);
  ctx.save();
  ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = 1;
  xTicks.forEach(tk=>{
    const px = Math.round(xPx(tk.v))+0.5;
    if (px<0 || px>w) return;
    ctx.beginPath(); ctx.moveTo(px, plotTop); ctx.lineTo(px, plotBottom); ctx.stroke();
  });
  ctx.restore();

  S.metrics.forEach((m,i)=>{
    const meta = METRIC_META[m];
    const range = S.chartMetricRanges[m] || (S.chartMetricRanges[m]=chartMetricRange(m));
    const isSpeed = m==='speed';
    const yPx = v => plotBottom - (v-range.min)/((range.max-range.min)||1)*(plotBottom-plotTop);
    const pts = [];
    (S.chartDs||[]).forEach(r=>{
      const v = meta.get(r);
      if (v==null) return;
      const xv = xVal(r);
      pts.push([xv, v]);
    });
    if (pts.length){
      ctx.save();
      ctx.beginPath();
      let started = false;
      pts.forEach(([xv,v])=>{
        const x = xPx(xv), y = yPx(v);
        if (!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);

      ctx.lineWidth = 1.6;
      ctx.lineJoin = 'round';
      ctx.stroke();
      if (isSpeed && pts.length>1){
        ctx.lineTo(xPx(pts[pts.length-1][0]), plotBottom);
        ctx.lineTo(xPx(pts[0][0]), plotBottom);

  if (!S.chartView) S.chartView = { min: xVal(S.records[0]), max: xVal(S.records[S.records.length-1]) };

function setSelection(idx, clientPos, source){
  S.selection = {idx};
  S.timelineSelectedId = null; // moving the seek bar hands highlight priority back to "whichever interval it's inside"
  const rec = S.records[idx];

  // graph click (or explicit jump/step) -> recentre the map on that point (same zoom level)
  if ((source==='chart' || source==='both') && S.hasGps && S.mapView && rec.lat!=null && rec.lon!=null){
    const [wx, wy] = lonLatToWorld(rec.lon, rec.lat, S.mapView.zoom);
    S.mapView.cx = wx; S.mapView.cy = wy;
  }
  if (S.hasGps && S.mapView){ if (seekDragActive || scrollSeeking) renderMapFrameThrottled(); else renderMapFrame(); }

  // map click (or explicit jump/step) -> recentre the graph on that point (same visible width)
  if ((source==='map' || source==='both') && S.chartView){
    const xs = S.chartView;
    const width = xs.max - xs.min;
    const target = xVal(rec);
    clampAndSetX(target-width/2, target+width/2); // also calls chart.update
  } else if (S.chartView){
    redrawChart();
  }

  updateSelBubble();
}

function updateSelBubble(){
  if (!S.selection) return;
  const r = S.records[S.selection.idx];
  $('#sClock').textContent = fmtClock(r.t);
  $('#sGross').textContent = fmtHMS(r.elapsed);
  $('#sDist').textContent = fmtKm(r.dist)+' km';
  // the right two slots always mirror whatever two metrics the chart's own
  // left/right Y-axes are currently showing (S.metrics[0]=left, [1]=right)
  const m0 = METRIC_META[S.metrics[0]], m1 = METRIC_META[S.metrics[1]];
  if (m0){ $('#sMetric1Label').textContent = m0.label; $('#sMetric1').textContent = m0.fmt(m0.get(r))+(m0.get(r)!=null?' '+m0.unit:''); }
  if (m1){ $('#sMetric2Label').textContent = m1.label; $('#sMetric2').textContent = m1.fmt(m1.get(r))+(m1.get(r)!=null?' '+m1.unit:''); }
  if (typeof renderTimeline==='function') renderTimeline(); // keep the seek line/highlight in sync with the current selection
}

function stepSelection(delta){
  if (!S.selection || !S.records.length) return;
  const newIdx = Math.max(0, Math.min(S.records.length-1, S.selection.idx+delta));
  if (newIdx===S.selection.idx) return;
  setSelection(newIdx, null, 'both');
}
function stepToZeroSpeed(dir){
  if (!S.selection || !S.records.length) return;
  const MOVING_THRESHOLD = 0.5; // m/s — matches the "stopped" definition used elsewhere in this app
  for (let i=S.selection.idx+dir; i>=0 && i<S.records.length; i+=dir){
    const spd = S.records[i].speed;
    if (spd!=null && spd<MOVING_THRESHOLD){ setSelection(i, null, 'both'); return; }
  }
}
// Holding a seek button down repeats its action, like a typical "press and
// hold" spinner/stepper control — the first repeat waits a bit longer than
// the rest so a normal tap doesn't accidentally fire a second step.
function attachHoldRepeat(el, fn){
  let timer = null, count = 0;
  function tick(){ fn(); count++; timer = setTimeout(tick, count===1?450:90); }
  function start(e){ e.preventDefault(); if (timer) return; count=0; tick(); }
  function stop(){ if (timer){ clearTimeout(timer); timer=null; } }
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
}
attachHoldRepeat($('#selPrevPt'), ()=> stepSelection(-1));
attachHoldRepeat($('#selNextPt'), ()=> stepSelection(1));

// Generic pointer-based drag-to-reorder for a vertical list of sibling
// elements inside `wrap`, each carrying a `.dragHandle` the user presses to
// start dragging. Reorders the DOM live as the dragged item crosses past its
// neighbours, then calls onReorder() once on release so the caller can sync
// its own backing array/state to the new DOM order.
function attachDragReorder(wrap, itemSelector, onReorder){
  // Uses a position:fixed "ghost" clone that tracks the pointer 1:1 every
  // move event (no lag, since it's a plain style write, not something that
  // depends on the row's own shifting layout position). The real row stays
  // put as a placeholder and only gets physically moved in the DOM when the
  // ghost has crossed a neighbour's midpoint — the ghost itself is
  // completely unaffected by that reflow, so it never stutters or jumps.
  let ghost=null, origRow=null, grabOffsetY=0;
  wrap.addEventListener('pointerdown', e=>{
    const handle = e.target.closest('[data-role=dragHandle]');
    if (!handle) return;
    const row = handle.closest(itemSelector);
    if (!row) return;
    origRow = row;
    const rect = row.getBoundingClientRect();
    grabOffsetY = e.clientY - rect.top;
    ghost = row.cloneNode(true);
    ghost.classList.add('dragGhost');
    ghost.style.position = 'fixed';
    ghost.style.left = rect.left+'px';
    ghost.style.top = rect.top+'px';
    ghost.style.width = rect.width+'px';
    ghost.style.margin = '0';
    ghost.style.zIndex = '999';
    ghost.style.pointerEvents = 'none';
    document.body.appendChild(ghost);
    row.classList.add('dragging');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  wrap.addEventListener('pointermove', e=>{
    if (!ghost) return;
    const top = e.clientY - grabOffsetY;
    ghost.style.top = top+'px';
    const ghostMid = top + ghost.offsetHeight/2;
    const siblings = Array.from(wrap.querySelectorAll(itemSelector)).filter(x=>x!==origRow);
    for (const sib of siblings){
      const r = sib.getBoundingClientRect();
      const sibMid = r.top + r.height/2;
      const sibIsAfter = !!(origRow.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING);
      if (sibIsAfter && ghostMid > sibMid){
        wrap.insertBefore(origRow, sib.nextSibling);
        break;
      } else if (!sibIsAfter && ghostMid < sibMid){
        wrap.insertBefore(origRow, sib);
        break;
      }
    }
  });
  function finishDrag(){
    if (!ghost) return;
    document.body.removeChild(ghost);
    ghost = null;
    origRow.classList.remove('dragging');
    origRow = null;
    onReorder();
  }
  wrap.addEventListener('pointerup', finishDrag);
  wrap.addEventListener('pointercancel', finishDrag);
}

function fmtDurationInput(sec){ return fmtHMS(sec); }

function parseHMSInput(str){
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return null;
  let sec=0;
  if (parts.length===3) sec = parts[0]*3600+parts[1]*60+parts[2];
  else if (parts.length===2) sec = parts[0]*60+parts[1];
  else sec = parts[0];
  return sec;
}
function parseClockInput(str){
  const parts = str.split(':').map(Number);
  if (parts.length<2 || parts.some(isNaN)) return null;
  const h=parts[0], m=parts[1], s=parts[2]||0;
  const day0 = new Date(S.records[0].t*1000);
  const base = new Date(day0.getFullYear(), day0.getMonth(), day0.getDate(), h, m, s).getTime()/1000;
  let elapsed = base - S.records[0].t;
  if (elapsed < 0) elapsed += 86400;
  return elapsed;
}
function elapsedFromDistanceKm(km){
  const target = km*1000;
  let best=S.records[0], bestD=Infinity;
  for (const r of S.records){ const dd=Math.abs(r.dist-target); if (dd<bestD){bestD=dd;best=r;} }
  return best.elapsed;
}

// Undo/redo history for interval edits (add/delete/reorder/set start-end).
// A snapshot is pushed just before each mutation; undo/redo just swap the
// current S.intervals with one from the appropriate stack.
let ivHistory = [], ivRedoStack = [];
function pushIvHistory(){
  ivHistory.push(JSON.stringify(S.intervals));
  if (ivHistory.length>50) ivHistory.shift();
  ivRedoStack = [];
  updateUndoRedoButtons();

function undoIv(){
  if (!ivHistory.length) return;
  ivRedoStack.push(JSON.stringify(S.intervals));
  S.intervals = JSON.parse(ivHistory.pop());
  renderTimeline();
  if (mapChartInitialized) renderMapFrame();
  updateUndoRedoButtons();
}
function redoIv(){
  if (!ivRedoStack.length) return;
  ivHistory.push(JSON.stringify(S.intervals));
  S.intervals = JSON.parse(ivRedoStack.pop());
  renderTimeline();
  if (mapChartInitialized) renderMapFrame();
  updateUndoRedoButtons();
}

  $('#undoBtn').disabled = !ivHistory.length;
  $('#redoBtn').disabled = !ivRedoStack.length;
  $('#undoBtnBottom').disabled = !ivHistory.length;

}

document.addEventListener('keydown', e=>{
  if (!(e.ctrlKey || e.metaKey)) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA') return;
  if (e.key==='z' || e.key==='Z'){ e.preventDefault(); if (e.shiftKey) redoIv(); else undoIv(); }
  else if (e.key==='y' || e.key==='Y'){ e.preventDefault(); redoIv(); }
});

/* ============ TIMELINE (page 2 interval editor) ============ */
// S.timelineSelectedId: id of a tap-selected interval, taking priority over
// the default "whichever interval contains the current seek position" rule.
function getActiveInterval(){
  if (S.timelineSelectedId!=null){
    const iv = S.intervals.find(x=>x.id===S.timelineSelectedId);
    if (iv) return iv;
  }
  if (!S.selection) return S.intervals[0] || null;
  const seekT = S.records[S.selection.idx].elapsed;
  return S.intervals.find(iv=>seekT>=iv.start && seekT<=iv.end) || null;
}
// Dragging the timeline pans the chart's visible range the same way
// dragging the chart itself does — the timeline just re-renders to follow,
// since it always mirrors the chart's current window (getTimelineTimeRange).
function attachTimelinePan(){
  const scroll = $('#timelineScroll');
  if (!scroll) return;
  // Pan and pinch both run on pointer events captured to #timelineScroll.
  // The old pinch listened to touchmove on #timelineScroll, but touch events
  // stay bound to the element the finger first landed on — a .tlTrack /
  // .tlClip that renderTimeline() then replaced via innerHTML. Once that
  // element was detached, its touchmoves no longer bubbled up here, so the
  // pinch only updated sporadically (and the browser was free to handle the
  // gesture itself). Captured pointers are always delivered to `scroll`,
  // whatever happens to the DOM underneath.
  const pointers = new Map(); // pointerId -> clientX/clientY
  let startX=0, dragging=false, moved=false, dragStartC=0, lastWidth=0, panPointerId=null, noTap=false;
  let pinch = null;
  const tlVelocity = createVelocityTracker();
  function beginPan(id, clientX, t){
    const rect = scroll.getBoundingClientRect();
    panPointerId = id; dragging = true; lastWidth = rect.width;
    startX = clientX-rect.left;
    dragStartC = currentScrollCenter();
    tlVelocity.reset(startX, t);
  }
  function beginPinch(){
    const [a, b] = [...pointers.values()];
    const rect = scroll.getBoundingClientRect();
    const xs = S.chartView;
    const midFrac = Math.max(0, Math.min(1, ((a.x+b.x)/2-rect.left)/(rect.width||1)));
    // Anchored pinch: remember the data value under the fingers' midpoint
    // and the range at the start, then derive each frame's window from the
    // gesture's total scale. The old version multiplied in a fresh ratio on
    // every touchmove, so rounding and the clamp at the data edges
    // accumulated into drift; this also lets the window follow the
    // midpoint, so pinch and two-finger pan work together like the map.
    pinch = {
      startDist: Math.max(1, Math.hypot(a.x-b.x, a.y-b.y)),
      startRange: xs.max-xs.min,
      anchor: xs.min + midFrac*(xs.max-xs.min),
    };
  }
  function updatePinch(){
    const [a, b] = [...pointers.values()];
    const rect = scroll.getBoundingClientRect();
    const nd = Math.max(1, Math.hypot(a.x-b.x, a.y-b.y));
    const midFrac = Math.max(0, Math.min(1, ((a.x+b.x)/2-rect.left)/(rect.width||1)));
    const lo = xVal(S.records[0]), hi = xVal(S.records[S.records.length-1]);
    let range = pinch.startRange * pinch.startDist/nd;
    range = Math.max((hi-lo)*0.0005, Math.min(hi-lo, range)); // same limits clampAndSetX enforces

  const xs = S.chartView;
  if (xs.min==null || xs.max==null) return {t0:0, t1:totalDur};
  if (S.xMode==='dist'){

function renderTimeline(){

    let placed = false;
    for (const track of tracks){
      if (!track.length || track[track.length-1].end<=iv.start){ track.push(iv); placed=true; break; }

let timelineStructKey = null;

// ellipsis).

function tlTextWidth(text){
  if (!tlMeasureCtx){
    tlMeasureCtx = document.createElement('canvas').getContext('2d');
    tlMeasureCtx.font = '700 10.5px '+(getComputedStyle(document.body).fontFamily||'sans-serif');
  }

function tlNameGeometry(c, W, pad){
  const innerL = c.L+pad, innerR = c.R-pad, innerW = innerR-innerL;
  if (innerW<8) return null;
  const tw = tlTextWidth(c.label)+8;
  if (tw>=innerW) return {left:innerL, width:innerW};
  const vl = Math.max(innerL, 0), vr = Math.min(innerR, W);

function tlCanvasSetup(canvas, W, H){

  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

}
// Per-ride heart-rate lookup for the clip backdrop: prefix sums over the

let tlHrCache = null;
function getHrCache(){

  if (tlHrCache && tlHrCache.recs===recs) return tlHrCache;
  const n = recs.length;
  const el = new Float64Array(n), pre = new Float64Array(n+1);

  const firstValid = recs.find(r=>r.hr!=null && r.hr>0);

  for (let i=0;i<n;i++){
    el[i] = recs[i].elapsed;
    const h = recs[i].hr;
    if (h!=null && h>0){ last = h; if (h<min) min=h; if (h>max) max=h; }
    pre[i+1] = pre[i] + (last!=null ? last : 0);

// Gridlines (behind the clips) and a faint heart-rate area (in front of

function drawTimelineCanvases(clips, W, H, t0, span, trackCount){
  const grid = $('#tlGridCanvas'), hrc = $('#tlHrCanvas');

  const gctx = tlCanvasSetup(grid, W, H);
  if (S.chartView){

    // from the chart through the label strip into the timeline

      const px = Math.round((tk.v-view.min)/vspan*W)+0.5;

    // are already faded)

function onClipTap(id){

  if (wasHighlighted){
    const iv = S.intervals.find(x=>x.id===id);
    if (iv) openRenameModal(iv);
  } else {
    renderTimeline();
  }

function handleTimelineTap(e){
  const scroll = $('#timelineScroll');
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.closest('.tlClipHandle')) return; // handles are for dragging (the highlighted clip's), not tapping
  const clipEl = el && el.closest('.tlClip');
  if (clipEl){ onClipTap(Number(clipEl.dataset.id)); return; }
  const rect = scroll.getBoundingClientRect();
  const {t0, t1} = getTimelineTimeRange();
  const span = Math.max(1, t1-t0);
  const frac = Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width));
  const rec = nearestRecordByElapsed(t0+frac*span);

function wireTimelineEvents(){

  });
}
let boundaryDrag = null;
function onClipHandleDown(e){

  const edge = e.currentTarget.dataset.edge;

function onClipHandleMove(e){
  if (!boundaryDrag) return;
  const scroll = $('#timelineScroll');
  const rect = scroll.getBoundingClientRect();
  const totalDur = S.records[S.records.length-1].elapsed || 1;
  const {t0, t1} = getTimelineTimeRange();
  const span = Math.max(1, t1-t0);
  const frac = Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width));

  if (!iv) return;
  if (boundaryDrag.edge==='start'){ iv.start = Math.max(0, Math.min(iv.end-1, t)); iv.startSet = true; }

// "◀🏃" / "🏃▶": jump to the nearest interval boundary point (any
// interval's start OR end — not just the highlighted one) before/after the
// current seek position, like a video editor's "next edit point" jump.
function jumpToBoundaryPoint(dir){
  if (!S.selection || !S.intervals.length) return;
  const seekT = S.records[S.selection.idx].elapsed;
  const points = [];
  S.intervals.forEach(iv=>{ points.push(iv.start); points.push(iv.end); });
  let best = null;
  points.forEach(t=>{
    if (dir<0 && t<seekT-1e-6 && (best==null || t>best)) best = t;
    if (dir>0 && t>seekT+1e-6 && (best==null || t<best)) best = t;
  });
  if (best==null) return;
  const rec = nearestRecordByElapsed(best);
  if (S.hasGps && (rec.lat==null || rec.lon==null)){
    showHeaderMsg('位置情報がありません。近接のGPS受信地点へ移動します。', true);
    const nearGps = nearestGpsRecordTo(rec);
    if (nearGps) setSelection(S.records.indexOf(nearGps), null, 'both');
    return;
  }
  setSelection(S.records.indexOf(rec), null, 'both');
}

  modal.querySelector('#ivRenameClose').addEventListener('click', close);
}

/* ============ RESULTS ============ */
function computeIntervalStats(iv, idx){
  const recs = S.records.filter(r=>r.elapsed>=iv.start && r.elapsed<=iv.end);
  const startTime = S.records[0].t+iv.start, endTime = S.records[0].t+iv.end;
  const st = {name: iv.name || ('区間'+((idx!=null?idx:0)+1)), nameType: iv.nameType, startName: iv.startName, endName: iv.endName, startTime, endTime,
    duration: 0, durationCum:null, netTime: null, netTimeCum: null, stoppedTime1: null, stoppedTime2: null, stoppedTime:null,
    distance: null, distanceCum:null, avgSpeedNet:null, avgSpeedGross:null, maxSpeed:null,
    minHr:null, avgHr:null, maxHr:null, avgCad:null, maxCad:null, avgPower:null, maxPower:null, np:null,
    elevMin:null, elevMax:null, avgElevation:null, elevGain:null, avgGradient:null, avgTemp:null, tss:null, ef:null, intensityFactor:null, pwr:null};
  if (!recs.length) return st;
  const d0 = recs[0].dist, d1 = recs[recs.length-1].dist;
  st.distance = d1-d0;
  const avg = arr => arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const speeds = recs.map(r=>r.speed).filter(v=>v!=null);
  const hrs = recs.map(r=>r.hr).filter(v=>v!=null);
  const cads = recs.map(r=>r.cad).filter(v=>v!=null);
  const pwrs = recs.map(r=>r.power).filter(v=>v!=null);
  const temps = recs.map(r=>r.temp).filter(v=>v!=null);
  const alts = recs.map(r=>r.alt).filter(v=>v!=null);
  st.maxSpeed = speeds.length? Math.max(...speeds)*3.6 : null;
  st.minHr = hrs.length? Math.min(...hrs): null;
  st.avgHr = avg(hrs); st.maxHr = hrs.length? Math.max(...hrs): null;
  st.avgCad = avg(cads); st.maxCad = cads.length? Math.max(...cads): null;
  st.avgPower = avg(pwrs); st.maxPower = pwrs.length? Math.max(...pwrs): null;
  st.avgTemp = temps.length? avg(temps) : null;
  st.elevMin = alts.length? Math.min(...alts): null;
  st.elevMax = alts.length? Math.max(...alts): null;
  st.avgElevation = avg(alts);
  st.startElev = alts.length ? alts[0] : null;
  st.endElev = alts.length ? alts[alts.length-1] : null;
  let gain=0;
  for (let i=1;i<recs.length;i++){
    if (recs[i].altSmooth!=null && recs[i-1].altSmooth!=null){
      const diff = recs[i].altSmooth-recs[i-1].altSmooth;
      if (diff>0) gain += diff;
    }
  }
  st.elevGain = recs.some(r=>r.alt!=null) ? gain : null;
  if (alts.length && st.distance){
    // two ways to define "average gradient": the simple elevation
    // difference between the interval's start and end points (can be
    // negative, or small even on a lumpy road), or the cumulative gain
    // divided by distance (always >= 0, reflects total climbing done)
    st.avgGradient = S.avgGradientMethod==='gain'
      ? (st.elevGain||0) / st.distance * 100
      : (alts[alts.length-1]-alts[0]) / st.distance * 100;
  }
  if (pwrs.length>8){
    const avgDt = (recs[recs.length-1].elapsed-recs[0].elapsed)/(recs.length-1||1);
    const win = Math.max(1, Math.round(30/Math.max(avgDt,0.1)));
    const roll=[];
    for (let i=0;i<recs.length;i++){
      const seg = recs.slice(Math.max(0,i-win+1), i+1).map(r=>r.power).filter(v=>v!=null);
      if (seg.length) roll.push(avg(seg));
    }
    if (roll.length){
      const p4 = roll.map(v=>v**4);
      st.np = Math.pow(avg(p4), 0.25);
    }
  }
  // "グロスタイム" (duration) is simply the wall-clock span of this interval
  // (end time minus start time) — it always includes whatever happened in
  // between, stops and gaps alike, by definition. Net time (moving time) and
  // the "recorded span" (used only for 停止時間1, below) still need to walk
  // the records: a gap between consecutive records much longer than the
  // normal sampling interval means the head unit's timer was paused or
  // powered off, and that gap is excluded from both.
  const TIMER_GAP_THRESHOLD = 30; // seconds
  const MOVING_THRESHOLD = 0.5; // m/s
  let recordedSpan = 0, net = 0, hasSpeedData = false;
  for (let i=1;i<recs.length;i++){
    const dt = recs[i].elapsed - recs[i-1].elapsed;
    if (dt > TIMER_GAP_THRESHOLD) continue; // treat as a timer-paused/off gap
    recordedSpan += dt;
    const spd = recs[i].speed!=null ? recs[i].speed : recs[i-1].speed;
    if (spd!=null){ hasSpeedData = true; if (spd>MOVING_THRESHOLD) net += dt; }
  }
  st.duration = st.endTime - st.startTime;
  st.netTime = hasSpeedData ? net : null;
  st.stoppedTime1 = hasSpeedData ? Math.max(0, recordedSpan-net) : null;
  st.avgSpeedGross = (st.distance && st.duration) ? st.distance/st.duration*3.6 : null;
  st.avgSpeedNet = (st.distance && st.netTime) ? st.distance/st.netTime*3.6 : null;
  // stoppedTime2 (and the toggle-consolidated stoppedTime) depend on the
  // NEXT interval's start time, so they're filled in afterwards once the
  // full row order is known (see computeAndRenderResults).
  // Efficiency Factor: NP (or average power if NP unavailable) divided by average heart rate
  const powerForEf = st.np!=null? st.np : st.avgPower;
  st.ef = (powerForEf!=null && st.avgHr) ? powerForEf/st.avgHr : null;
  // Intensity Factor and TSS both need an FTP value (entered by the user; never stored by default)
  if (st.np!=null && S.ftp){
    st.intensityFactor = st.np / S.ftp;
    st.tss = (st.duration * st.np * st.intensityFactor) / (S.ftp * 3600) * 100;
  }
  // Power Weight Ratio needs a weight value (entered by the user; never stored by default)
  if (st.avgPower!=null && S.weight){
    st.pwr = st.avgPower / S.weight;
  }
  return st;
}

let lastResults = null;
// Aggregation rule per column, used to build the "全区間" summary row.
const SUMMARY_AGG = {
  distance:'sum', distanceCum:'latestCum',
  elevMin:'min', elevMax:'max', elevGain:'sum',
  avgTemp:'avgWeighted',
  startTime:'earliest', endTime:'latest',
  duration:'sum', durationCum:'latestCum',
  netTime:'sum', netTimeCum:'latestCum',
  stoppedTime:'sum',
  maxSpeed:'max',
  minHr:'min', avgHr:'avgWeighted', maxHr:'max',
  avgCad:'avgWeighted', maxCad:'max',
  avgPower:'avgWeighted', maxPower:'max', np:'avgWeighted',
  intensityFactor:'avgWeighted', ef:'avgWeighted', tss:'sum',
  pwr:'avgWeighted',
};
function computeSummaryRow(rows){
  if (!rows.length) return null;
  const nums = key => rows.map(r=>r[key]).filter(v=>v!=null);
  const sum = arr => arr.reduce((a,b)=>a+b,0);
  const latestRow = rows.reduce((a,b)=> (b.endTime>a.endTime? b:a), rows[0]);
  function weightedAvg(key){
    let wsum=0, vsum=0;
    rows.forEach(r=>{ if (r[key]!=null && r.duration){ vsum += r[key]*r.duration; wsum += r.duration; } });
    return wsum>0 ? vsum/wsum : null;
  }
  const aggFns = {
    sum: k=> nums(k).length? sum(nums(k)) : null,
    min: k=> nums(k).length? Math.min(...nums(k)) : null,
    max: k=> nums(k).length? Math.max(...nums(k)) : null,
    avgWeighted: k=> weightedAvg(k),
    earliest: k=> nums(k).length? Math.min(...nums(k)) : null,
    latest: k=> nums(k).length? Math.max(...nums(k)) : null,
    latestCum: k=> latestRow[k]!=null? latestRow[k] : null,
  };
  const s = { name:'全区間', isSummary:true };
  COLUMN_DEFS.forEach(d=>{
    const type = SUMMARY_AGG[d.k];
    s[d.k] = type ? aggFns[type](d.k) : null;
  });
  // avgGradient, avgSpeedNet and avgSpeedGross are NOT time-weighted
  // averages of each interval's own rate — that's mathematically wrong for
  // a rate (a fast, short downhill segment would get out-voted by a slow,
  // long flat one). They're derived directly from the already-correctly-
  // summed totals instead: overall gradient from the true first/last
  // elevation over the total distance, overall speed from total distance
  // over total time.
  const firstRow = rows.reduce((a,b)=> (b.startTime<a.startTime? b:a), rows[0]);
  const lastElevRow = rows.reduce((a,b)=> (b.endTime>a.endTime? b:a), rows[0]);
  // The gross-time SUM (s.duration, from SUMMARY_AGG's per-interval 'sum')
  // only adds up each interval's own span — if there are any gaps between
  // the analysed intervals (time not assigned to any interval at all),
  // that sum under-counts the true elapsed time, which made the gross
  // average speed come out too fast. The true denominator for an overall
  // gross average speed is the real wall-clock span from the very first
  // interval's start to the very last interval's end (matching how
  // "合計グロスタイム" is already computed).
  const trueSpan = lastElevRow.endTime - firstRow.startTime;
  if (s.distance){
    s.avgGradient = S.avgGradientMethod==='gain'
      ? (s.elevGain||0) / s.distance * 100
      : (lastElevRow.endElev!=null && firstRow.startElev!=null)
        ? (lastElevRow.endElev-firstRow.startElev) / s.distance * 100
        : null;
    s.avgSpeedGross = trueSpan ? s.distance/trueSpan*3.6 : null;
    s.avgSpeedNet = s.netTime ? s.distance/s.netTime*3.6 : null;
  }
  return s;
}

function computeAndRenderResults(){
  validateIntervals();
  if (!$('#intervalErr').classList.contains('hidden')) return false;
  const cols = S.resultColumns.filter(c=>c.enabled).map(c=>c.key);
  const rows = S.intervals.map(computeIntervalStats);
  // "累積グロスタイム" reads from the first analyzed interval's own start, not
  // from the whole original recording's start — so a user who discards
  // everything before a race/attempt segment and analyzes only that part
  // gets cumulative figures starting from ~0, not from a large offset.
  const t0 = rows.length ? rows[0].startTime : S.records[0].t;
  let cumNet = 0, sawNet = false, cumDist = 0, sawDist = false;
  rows.forEach(r=>{
    if (r.netTime!=null){ cumNet += r.netTime; sawNet = true; }
    r.netTimeCum = sawNet ? cumNet : null;
    if (r.distance!=null){ cumDist += r.distance; sawDist = true; }
    r.distanceCum = sawDist ? cumDist : null;
    // "累積グロスタイム": real elapsed clock time from the very start of the
    // ride (0km) to the end of this interval — not a sum of each interval's
    // own duration, so any gap between intervals (including a paused/off
    // head unit) is naturally included.
    r.durationCum = r.endTime - t0;
  });
  // stoppedTime2: gap between this interval's start and the NEXT interval's
  // start, minus this interval's own net (moving) time — i.e. everything that
  // wasn't actual riding between one start point and the next, timer-paused
  // gaps included. The last row has no "next" interval to measure to, so it
  // falls back to stoppedTime1 instead of being left blank.
  for (let i=0;i<rows.length;i++){
    const r = rows[i];
    if (i<rows.length-1 && r.netTime!=null){
      r.stoppedTime2 = Math.max(0, (rows[i+1].startTime - r.startTime) - r.netTime);
    } else {
      r.stoppedTime2 = r.stoppedTime1;
    }
    // the displayed "停止時間" column shows whichever definition the
    // include/exclude toggle currently selects
    r.stoppedTime = S.grossIncludesStoppedTime ? r.stoppedTime2 : r.stoppedTime1;
  }
  // the summary row (if any) is added only to what's displayed/exported —
  // the power chart below always uses the plain per-interval rows.
  let displayRows = rows;
  if (S.summaryRowMode !== 'off'){
    const summary = computeSummaryRow(rows);
    if (summary) displayRows = S.summaryRowMode==='first' ? [summary, ...rows] : [...rows, summary];
  }
  lastResults = {cols, rows: displayRows};
  renderResultsTable(cols, displayRows);
  renderPowerChart(rows);
  setExportEnabled(true);
  saveState();
  return true;
}

// Darkens a hex color (for label text that should read as "this metric's
// color" but stay legible against a light fill of the same hue).
// Traces a bold outline around a set of step-shaped bars (drops to the
// baseline across any gap between them, so the outline fully encloses the
// filled area — like the outer silhouette of a step/area chart).
function buildStepOutline(items, baseline){
  const sorted = items.slice().sort((a,b)=>a.x0-b.x0);
  let d = '', lastX = null;
  sorted.forEach(it=>{
    if (lastX==null){
      d += 'M '+it.x0+' '+baseline+' L '+it.x0+' '+it.y+' ';
    } else if (Math.abs(it.x0-lastX)>0.5){
      d += 'L '+lastX+' '+baseline+' L '+it.x0+' '+baseline+' L '+it.x0+' '+it.y+' ';
    } else {
      d += 'L '+it.x0+' '+it.y+' ';
    }
    d += 'L '+it.x1+' '+it.y+' ';
    lastX = it.x1;
  });
  if (lastX!=null) d += 'L '+lastX+' '+baseline+' ';
  return d;
}

function darkenColor(hex, amount){
  amount = amount==null ? 0.35 : amount;
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
  if (!m) return hex;
  const [r,g,b] = [1,2,3].map(i=>Math.round(parseInt(m[i],16)*(1-amount)));
  return 'rgb('+r+','+g+','+b+')';
}

// Tapping the dial opens a scrollable wheel picker (like the native iOS
// date/time picker): a vertical list of numbers with scroll-snap, the

const WHEEL_MIN = 2, WHEEL_MAX = 200, WHEEL_ITEM_H = 26;
// The wheel's item list is ["生データ", 2, 3, ..., 200] — "生データ" sits

function openSubdivideWheel(){
  const scroll = $('#wheelScroll');
  scroll.innerHTML = '';
  const rawDiv = document.createElement('div');
  rawDiv.className = 'wheelItem'; rawDiv.textContent = '生データ'; rawDiv.dataset.n = 'raw';

  scroll.scrollTop = idx*WHEEL_ITEM_H;
  updateWheelHighlight._lastIdx = idx;
  updateWheelHighlight();
}
function updateWheelHighlight(){
  const scroll = $('#wheelScroll');
  const items = scroll.querySelectorAll('.wheelItem');
  const idx = Math.max(0, Math.min(items.length-1, Math.round(scroll.scrollTop/WHEEL_ITEM_H)));
  items.forEach((el,i)=> el.classList.toggle('centered', i===idx));
  if (idx!==updateWheelHighlight._lastIdx){
    updateWheelHighlight._lastIdx = idx;
    if (navigator.vibrate) navigator.vibrate(8); // no-op on iOS Safari (unsupported there), works elsewhere
  }
  const raw = items[idx] && items[idx].dataset.n;
  return raw==='raw' ? 'raw' : Number(raw);
}
